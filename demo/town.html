<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>奶龙小镇 demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700;900&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#241733;color:#FFF4D6;font-family:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
  #hud{position:fixed;left:8px;right:8px;top:calc(6px + env(safe-area-inset-top));display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;z-index:2}
  .chip{background:#3D2A5C;border:3px solid #2B1B3D;box-shadow:inset 0 0 0 2px #5B4580,0 3px 0 #1A1026;padding:3px 9px;font-size:13px;font-weight:700}
  .num{font-family:Silkscreen,monospace;font-weight:400}
  .chip b{color:#ffd23f}
  #edict{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(6px + env(safe-area-inset-top));font-size:12px;color:#FFF4D6;max-width:46vw}
  .px{background:#FFD23F;color:#2B1B3D;border:4px solid #2B1B3D;box-shadow:inset -4px -4px 0 #D9A400,inset 4px 4px 0 #FFF0A0,0 5px 0 #1A1026;padding:8px 16px;min-height:44px;font-size:18px;font-weight:400;font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif;cursor:pointer;white-space:nowrap}
  .px:active{transform:translateY(4px);box-shadow:inset -4px -4px 0 #D9A400,inset 4px 4px 0 #FFF0A0,0 1px 0 #1A1026}
  .px.gray{background:#5B4580;color:#FFF4D6;box-shadow:inset -4px -4px 0 #3D2A5C,inset 4px 4px 0 #8C73B5,0 5px 0 #1A1026}
  .px.blue{background:#4AA3DF;color:#fff;box-shadow:inset -4px -4px 0 #2E7BB0,inset 4px 4px 0 #A6DBFF,0 5px 0 #1A1026}
  .px[disabled]{opacity:.45}
  .panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1A1026b0;z-index:5;padding:16px;box-sizing:border-box}
  .card{width:min(100%,460px);max-height:100%;overflow:auto;background:#3D2A5C;border:4px solid #2B1B3D;box-shadow:inset 0 0 0 3px #5B4580,0 6px 0 #1A1026;padding:16px;text-align:center;line-height:1.55;box-sizing:border-box}
  .card h2{margin:0 0 6px;color:#FFD23F;font-size:24px;font-weight:400;font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif}
  .card p{margin:6px 0;font-size:14px;color:#FFF4D6;text-align:left}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .up{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#2B1B3D;padding:8px;margin:6px 0;text-align:left;font-size:13px}
  .up b{color:#ffd23f}
  .big{font-size:56px;line-height:1.1;margin:6px 0}
  .ledger{width:100%;font-size:14px;border-collapse:collapse;margin:6px 0}
  .ledger td{padding:3px 4px;border-bottom:2px dashed #5B4580}.ledger td:last-child{text-align:right}
  .bubble{display:inline-block;background:#fff8e6;color:#2b1f45;border:3px solid #0e0a18;padding:8px 12px;font-weight:800;font-size:15px;margin:6px 0}
  .pad{position:fixed;border:4px solid #2B1B3D;font-weight:400;font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent;z-index:3;width:76px;height:76px;font-size:22px}
  #lockB{right:calc(126px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));background:#4AA3DF;color:#fff;box-shadow:inset -5px -5px 0 #2E7BB0,inset 5px 5px 0 #A6DBFF,0 6px 0 #1A1026}
  #lockB.on{background:#A6DBFF;color:#2B1B3D;transform:translateY(4px)}
  #zoomB{left:calc(14px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));width:60px;height:60px;font-size:15px;line-height:1.1;background:#5B4580;color:#FFF4D6;box-shadow:inset -4px -4px 0 #3D2A5C,inset 4px 4px 0 #8C73B5,0 5px 0 #1A1026}
  #punchB{right:calc(14px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));width:100px;height:100px;font-size:30px;background:#FFD23F;color:#2B1B3D;box-shadow:inset -6px -6px 0 #D9A400,inset 6px 6px 0 #FFF0A0,0 6px 0 #1A1026}
  #punchB:active,#zoomB:active{transform:translateY(4px)}
  #gameTop{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;z-index:3;align-items:center}
  #gameTop button{font-size:15px;padding:4px 10px;min-height:40px}
  #rVal{font-family:Silkscreen,monospace;font-weight:400;color:#FFD23F}
  #gameUI.counter #calB,#gameUI.counter #tuneB,#gameUI.counter #giveupB{position:fixed;left:calc(14px + env(safe-area-inset-left));width:110px;font-size:15px;min-height:40px;padding:4px 6px}
  #gameUI.counter #giveupB{bottom:calc(88px + env(safe-area-inset-bottom))}#gameUI.counter #calB{bottom:calc(140px + env(safe-area-inset-bottom))}#gameUI.counter #tuneB{bottom:calc(192px + env(safe-area-inset-bottom))}
  #ratioBox{display:flex;gap:4px;align-items:center}
  #toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:24px;font-family:'ZCOOL KuaiLe',sans-serif;color:#FFD23F;text-shadow:3px 3px 0 #2B1B3D;pointer-events:none;z-index:6;opacity:0;transition:opacity .2s;white-space:nowrap}
  #tip{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;color:#d9cdf0;text-shadow:2px 2px 0 #0e0a18;pointer-events:none;z-index:2;text-align:center;width:min(70vw,460px)}
  #dlg{position:fixed;inset:0;z-index:7}
  #dlgBox{position:absolute;left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));min-height:26%;background:#FFF4D6;color:#2B1B3D;border:4px solid #2B1B3D;box-shadow:inset 0 0 0 3px #FFD23F,0 6px 0 #1A1026;padding:30px 18px 14px;box-sizing:border-box}
  #dlgName{position:absolute;left:10px;top:-22px;background:#FFD23F;border:4px solid #2B1B3D;padding:2px 18px;font-family:"ZCOOL KuaiLe",sans-serif;font-size:20px}
  #dlgText{margin:0;font-size:18px;line-height:1.6;font-weight:700}
  #dlgMore{position:absolute;right:12px;bottom:6px;font-size:12px;color:#8a7a6a}
  #pL,#pR{position:absolute;bottom:calc(10px + 26% - 4px);height:min(44vh,240px);image-rendering:pixelated}
  #pL{left:calc(16px + env(safe-area-inset-left))}#pR{right:calc(16px + env(safe-area-inset-right))}
  #rot{position:fixed;inset:0;z-index:20;background:#1b1430;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:18px;font-weight:900;color:#ffd23f;text-align:center}
  #rot div{font-size:64px;animation:spin 1.6s ease-in-out infinite}
  @keyframes spin{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
  .hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span class="chip" style="display:flex;align-items:center;gap:5px"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#fff8e6" stroke="#0e0a18" stroke-width="2.5"/><line id="clkH" x1="10" y1="10" x2="10" y2="6" stroke="#0e0a18" stroke-width="2.2" stroke-linecap="round"/><line id="clkM" x1="10" y1="10" x2="10" y2="4" stroke="#0e0a18" stroke-width="1.6" stroke-linecap="round"/></svg><b id="hTime" class="num">08:00</b> 第 <b id="hDay">1</b> 天</span>
  <span class="chip">金币 <b id="hCoin" class="num">0</b></span>
  <span class="chip">口碑 <b id="hRep">0</b></span>
  <span class="chip" id="edict"></span>
</div>
<div id="tip"></div>
<div id="rot"><div>📱</div>这一版是横屏的，请把手机横过来</div>
<div id="toast"></div>
<div id="dlg" class="hidden"><canvas id="pL" width="36" height="40"></canvas><canvas id="pR" width="36" height="40"></canvas><div id="dlgBox"><span id="dlgName"></span><p id="dlgText"></p><span id="dlgMore">▼ 点一下继续</span></div></div>

<div id="gameUI" class="hidden">
  <div id="gameTop"><span id="ratioBox" class="hidden"><button class="px gray" id="rDn">−</button><b id="rVal" class="chip"></b><button class="px gray" id="rUp">＋</button></span><button class="px gray" id="calB">重新校准</button><button class="px gray" id="tuneB">陀螺仪设置</button><button class="px gray" id="giveupB">交货</button></div>
  <button id="lockB" class="pad">固定</button>
  <button id="zoomB" class="pad hidden">放大<br>1×</button>
  <button id="punchB" class="pad">打孔</button>
</div>

<div class="panel" id="panel"><div class="card" id="card"></div></div>

<script src="../tune.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const lc=document.createElement('canvas'),lx=lc.getContext('2d');
let S=3,LW=200,LH=120,DPR=1;
// 已定：俯视角、只横屏（h）。留着 ?view=side 横版侧视、?view=top 横竖屏都行 两个对比版本
const VIEW=(()=>{const v=new URLSearchParams(location.search).get('view');return ['top','h','side'].includes(v)?v:'h'})();
let CAM=0,GY=100,WORLD=400;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;
  S=Math.max(2,Math.floor(Math.min(innerWidth,innerHeight)/120));
  LW=Math.ceil(innerWidth/S);LH=Math.ceil(innerHeight/S);
  lc.width=LW;lc.height=LH;
  $('rot').style.display=VIEW!=='top'&&innerHeight>innerWidth?'flex':'none';
  VIEW==='side'?layoutSide():layoutTown();
}
addEventListener('resize',resize);

// ---------- save ----------
const SHOPS={
  home:{name:'主角家',desc:'奶帝十字架：进义体诊所给自己装义体'},
  biscuit:{name:'饼干店',desc:'给苏打饼干打孔，接定制单',base:20},
  hair:{name:'植发店',desc:'在头皮上打又小又密的孔',base:35,price:150},
  tattoo:{name:'纹身店',desc:'沿图案一针一针扎出纹身',base:50,price:250},
};
const SHOP_UPS=[
  {k:'sign',name:'招牌',eff:'估值 +20%',cost:[100,220,450]},
  {k:'bell',name:'门铃',eff:'每天多来 1 单',cost:[80,200]},
];
const EDICTS=[
  {t:'今天让一位客人超满意（超赞或抢着买）',r:30,ok:d=>d.best>=4},
  {t:'今天不许有客人生气',r:20,ok:d=>d.orders>0&&d.angry===0},
  {t:'今天卖出 3 单',r:15,ok:d=>d.orders>=3},
  {t:'今天赚到 80 金币',r:25,ok:d=>d.rev>=80},
];
const DEF={day:1,coins:50,rep:0,open:{home:1,biscuit:1,hair:0,tattoo:0},up:{wrist:0,zoom:0,night:0,sign:0,bell:0},edict:0,sess:0,clock:480,phase:'day',ratio:1};
let G=(()=>{try{const s=JSON.parse(localStorage.getItem('nailongTown6')||'null');if(s)return Object.assign({},DEF,s)}catch(e){}return JSON.parse(JSON.stringify(DEF))})();
let D={orders:0,rev:0,angry:0,best:0,tips:0,mat:0};
function save(){try{localStorage.setItem('nailongTown6',JSON.stringify(G))}catch(e){}}
// ---------- 奶帝十字架 → 义体诊所（demo/clinic.html）。金币两边共用，装上的义体在这里生效 ----------
const clinicSave=()=>{try{return JSON.parse(localStorage.getItem('nailongClinic1')||'null')}catch(e){return null}};
(()=>{const c=clinicSave();if(G.atClinic&&c&&c.coins!=null)G.coins=c.coins;delete G.atClinic;save()})();
// 装在插槽里的义体才算数，返回档位 0–3
function aug(k){const c=clinicSave();if(!c||!c.sock)return 0;return Object.values(c.sock).some(a=>a.includes(k))?(c.own[k]||0):0}
function goClinic(){const c=clinicSave();
  if(c){c.coins=G.coins;c.open={hair:!!G.open.hair,tattoo:!!G.open.tattoo};try{localStorage.setItem('nailongClinic1',JSON.stringify(c))}catch(e){}}
  G.atClinic=1;save();location.href='clinic.html'}
function fmtClock(m){m=Math.round(m);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function setClock(m){G.clock=m;const h=(m/60)%12,mi=m%60;
  const hand=(id,a,l)=>{const e=$(id);e.setAttribute('x2',10+Math.sin(a)*l);e.setAttribute('y2',10-Math.cos(a)*l)};
  hand('clkH',h/12*Math.PI*2,4.5);hand('clkM',mi/60*Math.PI*2,6.5);$('hTime').textContent=fmtClock(m)}
function hud(){setClock(G.clock);$('hDay').textContent=G.day;$('hCoin').textContent=G.coins;$('hRep').textContent=G.rep;
  $('edict').textContent=G.phase==='night'?'打烊了 · 找镇民聊天，或回家':G.sess===1&&G.clock>=12*60&&G.clock<13*60?'午休 · 13:00 下午场 · 还能营业 1 次':'今天还能营业 '+(2-G.sess)+' 次 · 公告板看旨意'}
function toast(t,s=1.2){const el=$('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.opacity=0,s*1000)}

// ---------- 像素角色图（策划案/像素角色，原尺寸 PNG，最近邻放大） ----------
const SPR={};['needle','god','redbaby','dog'].forEach(k=>{const im=new Image();im.src='img/'+k+'.png';SPR[k]=im});
const NPC_KINDS=['redbaby','dog'],KIND_NAME={redbaby:'红温奶娃',dog:'奶狗'};
// 时间写在颜色里：早上偏暖，17 点后橙红，19 点后压暗
function tintAt(m){return m>=19*60?['#0b0b3a',0.55]:m>=17*60?['#FF5A1F',0.26]:m<10*60?['#FFB347',0.07]:null}
const tintCache={};
function sprite(k,t){const im=SPR[k];if(!im||!im.complete||!im.naturalWidth)return null;if(!t)return im;
  const key=k+t[0]+t[1];if(tintCache[key])return tintCache[key];
  const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext('2d');
  g.drawImage(im,0,0);g.globalCompositeOperation='source-atop';g.globalAlpha=t[1];g.fillStyle=t[0];g.fillRect(0,0,c.width,c.height);
  return tintCache[key]=c}
// 角色画在高清层：px = 每个设定图像素占几个屏幕像素（整数，保证像素清楚）
function sprPx(f=1){return Math.max(1,Math.round(Math.min(innerWidth,innerHeight)/312*DPR*f))}
function drawSprite(k,x,y,px,o={}){ // x,y = 脚底中心（屏幕设备像素）
  const im=sprite(k,o.tint);if(!im)return;const w=im.width*px,h=im.height*px,b=o.bob?Math.round(Math.abs(Math.sin(o.bob*10))*px*1.5):0;
  ctx.save();ctx.imageSmoothingEnabled=false;ctx.globalAlpha=o.alpha??1;
  if(o.flip){ctx.translate(Math.round(x),0);ctx.scale(-1,1);ctx.drawImage(im,Math.round(-w/2),Math.round(y-h-b),w,h)}
  else ctx.drawImage(im,Math.round(x-w/2),Math.round(y-h-b),w,h);ctx.restore()}
function sprH(k,f=1){const im=SPR[k];return (im&&im.naturalHeight||40)*sprPx(f)/DPR/S} // 低清坐标里的高度，用来点中角色
// ---------- pixel helpers ----------
function R(x,y,w,h,c){lx.fillStyle=c;lx.fillRect(Math.round(x),Math.round(y),w,h)}
function nailong(x,y,mood=0,t=0,scale=1,needle=true){ // x,y = feet center
  const s=scale,b=t?Math.round(Math.sin(t*12)*0.6):0;
  const P=(px,py,w,h,c)=>R(x+px*s,y+(py+b)*s,w*s,h*s,c);
  P(-6,-12,12,11,'#ffd23f');P(-7,-10,1,8,'#ffd23f');P(6,-10,1,8,'#ffd23f');P(-5,-13,10,1,'#ffd23f');
  P(-6,-2,12,1,'#e0a800');P(-4,-1,3,1,'#e0a800');P(1,-1,3,1,'#e0a800');
  P(-3,-9,8,6,'#fff2c0');
  // needle on head
  if(needle){P(0,-19,1,6,'#c9d2e0');P(-1,-15,3,2,'#7fb0ff');P(0,-20,1,1,'#ffffff')}
  if(mood===1){P(-4,-10,2,1,'#2b1f45');P(2,-10,2,1,'#2b1f45');P(-2,-6,4,2,'#c4473a');P(-1,-6,2,1,'#ff8a8a')}
  else{P(-4,-10,2,2,'#2b1f45');P(2,-10,2,2,'#2b1f45');P(-1,-6,2,1,'#2b1f45');P(-6,-7,2,1,'#ff9aa8');P(4,-7,2,1,'#ff9aa8')}
}

// ---------- town (top-down, layout from the producer's sketch) ----------
let B=[],streets=[],deco=[],npcs=[],me={x:30,y:80,tx:30,ty:80,goal:null},townT=0,scene='town',MAP=null;
// sketch coordinates (1400 × 800): buildings and the little paths between them
const SK_B={home:[158,67,315,206],biscuit:[888,67,315,206],hair:[259,457,315,206],tattoo:[962,457,316,206]};
const SK_P=[[[473,226],[888,226]],[[316,273],[316,385],[337,385],[337,457]],[[1057,273],[1057,457]],[[574,600],[962,600]]];
function rnd(seed){let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647}
// ---------- 横屏小镇地图（画面方案「小镇地图 · 优化后」，844×390 拉满整屏） ----------
// 上边树林和山崖、下边沙滩和水；弯曲的土路像树枝一样分叉，连到四栋房子、中间的公告板和最左边的出镇路口
const MP={
  paths:[[[-10,196],[120,196],['q',160,196,200,186],[420,186],['q',470,186,520,196],[860,196]],
    [[186,188],[186,140]],[[640,196],['q',640,160,664,140]],[[250,186],['q',240,230,210,316]],[[560,196],['q',600,230,650,316]],[[420,186],[420,330]]],
  bld:{home:[130,64,112,88],biscuit:[600,58,128,92],hair:[150,238,112,88],tattoo:[600,238,112,88]},
  trees:[[45,132],[305,128],[775,142],[535,272],[325,282],[55,282],[785,282],[350,104],[515,110],[90,170],[820,170],[750,104]],
  board:[400,160,40,30],exit:[0,176,46,40],
  // 每个 NPC 只在自己的范围里闲逛（范围框游戏里不显示）。照抄 NPC设计.xlsx v002 · NPCConfig 的 WanderRect（x|y|宽|高）和 WanderSpeed（像素/秒）
  zones:[['redbaby',446,206,136,96,18],['dog',226,98,124,80,24]],
};
function layoutMap(){
  const kx=LW/844,ky=LH/390,X=x=>x*kx,Y=y=>y*ky;MAP={map:true,kx,ky,X,Y,x:0,y:0,w:LW,h:LH};HL=null;
  B=Object.entries(MP.bld).map(([k,[x,y,w,h]])=>({k,x:Math.round(X(x+w/2)),y:Math.round(Y(y+h)),w:Math.round(X(w)),h:Math.round(Y(h))}));
  streets=[];deco=MP.trees.map(([x,y])=>({t:'tree',x:Math.round(X(x)),y:Math.round(Y(y))}));
  const [bx,by,bw,bh]=MP.board;deco.push({t:'board',x:Math.round(X(bx+bw/2)),y:Math.round(Y(by+bh+10)),w:Math.round(X(bw)),h:Math.round(Y(bh))});
  const rand=rnd(11);for(let i=0;i<60;i++){const x=40+rand()*780,y=90+rand()*220;deco.push({t:'flower',x:Math.round(X(x)),y:Math.round(Y(y)),c:['#ff7fa8','#fff4a8','#ffffff','#b48cff'][Math.floor(rand()*4)]})}
  deco.sort((a,b)=>a.y-b.y);
  npcs=MP.zones.map(([kind,zx,zy,zw,zh,spd])=>{const spot=()=>({x:X(zx+8+Math.random()*(zw-16)),y:Y(zy+14+Math.random()*(zh-16))}),p=spot(),q=spot();
    return{x:p.x,y:p.y,tx:q.x,ty:q.y,wait:Math.random()*3,spot,kind,spd:spd*kx}});
  if(!me.goal){const h=B[0];me.x=me.tx=h.x;me.y=me.ty=h.y+5}
}
function drawMapBg(){

  if(!gotTilt)await new Promise(r=>setTimeout(r,700));return gotTilt}catch(e){return false}}
function calibrate(){base={x:raw.x,y:raw.y}}
// shared 陀螺仪设置 panel (../tune.js); speed/follow/tremor apply relative to the main game's defaults
const TUNE=SodaTune.TUNE,tiltAxis=SodaTune.tiltAxis;
const keys={};addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);
$('calB').onclick=()=>{calibrate();toast('已校准',0.8)};
SodaTune.attach({tilt:()=>({x:raw.x-base.x,y:raw.y-base.y}),calibrate:()=>{calibrate();toast('已校准',0.8)}});
$('tuneB').onclick=()=>SodaTune.isOpen()?SodaTune.close():SodaTune.open();

// ---------- punching ----------
let P=null;
const FORCES=['白','灰','黑'];
function forceOf(t){const m=1-[0,.25,.4,.55][aug('pump')];return t<0.4*m?'白':t<0.9*m?'灰':'黑'}
function chargeStart(){if(P&&!P.done){P.charging=true;P.charge=0}}
function chargeEnd(){if(P&&P.charging){P.charging=false;punch(forceOf(P.charge))}}
function chargeCancel(){if(P)P.charging=false}
async function startPunch(o){
  if(!askedTilt){askedTilt=true;await enableTilt()}
  hide();scene='punch';calibrate();
  const kind=o.kind,tg=[];
  if(kind==='biscuit'){for(let r=0;r<2;r++)for(let c=0;c<3;c++)tg.push({x:-24+c*24,y:-9+r*18,r:5})}
  else if(kind==='hair'){for(let r=0;r<2;r++)for(let c=0;c<5;c++)tg.push({x:-24+c*12+(r?6:0),y:-14+r*9,r:3})}
  else{for(let i=0;i<8;i++){const a=i/8*Math.PI*2,x=16*Math.pow(Math.sin(a),3),y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));tg.push({x:x*1.4,y:y*1.4-2,r:3.5})}}
  P={o,kind,tg,holes:[],wrong:0,t:0,limit:(kind==='tattoo'?25:20),n:{x:-40,y:20},v:{x:0,y:0},lock:null,zoom:1,trem:{x:0,y:0},done:false};
  $('gameUI').classList.remove('hidden');
  $('zoomB').classList.toggle('hidden',!aug('fireeye'));$('zoomB').innerHTML='放大<br>1×';
  $('tip').textContent=gotTilt?'倾斜手机移动针头，按住「固定」稳住，点「打孔」扎下':'没检测到陀螺仪：电脑上用方向键移动针头（手机请用 https 打开并允许陀螺仪）';
}
function lockDown(e){e.preventDefault();if(P)P.lock={x:P.n.x,y:P.n.y};$('lockB').classList.add('on')}
function lockUp(e){e.preventDefault();if(P)P.lock=null;$('lockB').classList.remove('on')}
$('lockB').addEventListener('pointerdown',lockDown);$('lockB').addEventListener('pointerup',lockUp);$('lockB').addEventListener('pointercancel',lockUp);$('lockB').addEventListener('pointerleave',lockUp);
$('zoomB').onclick=()=>{if(!P)return;const max=1+aug('fireeye');P.zoom=P.zoom>=max?1:P.zoom+1;$('zoomB').innerHTML='放大<br>'+P.zoom+'×'};
$('punchB').addEventListener('pointerdown',e=>{e.preventDefault();chargeStart()});
$('punchB').addEventListener('pointerup',e=>{e.preventDefault();chargeEnd()});
$('punchB').addEventListener('pointercancel',chargeCancel);$('punchB').addEventListener('pointerleave',chargeCancel);
addEventListener('keydown',e=>{if(e.key===' '&&!e.repeat&&P&&!P.charging)chargeStart()});addEventListener('keyup',e=>{if(e.key===' ')chargeEnd()});
$('giveupB').onclick=()=>finishPunch();
$('dlg').addEventListener('pointerdown',e=>{e.preventDefault();dlgNext()});
$('rDn').onclick=()=>setRatio(-0.1);$('rUp').onclick=()=>setRatio(0.1);
function onObject(x,y){const k=P.kind;
  if(k==='biscuit')return Math.abs(x)<42&&Math.abs(y)<25;
  if(k==='hair')return (x*x)/(40*40)+(y+4)*(y+4)/(28*28)<1;
  return Math.abs(x)<44&&Math.abs(y+2)<30}
function punch(force){
  if(!P||P.done)return;const {x,y}=P.n;
  if(!onObject(x,y)){toast('扎到台子上了',0.6);return}
  let best=null,bd=1e9;P.tg.forEach(t=>{if(t.hit)return;const d=Math.hypot(t.x-x,t.y-y);if(d<bd){bd=d;best=t}});
  const hole={x,y,ok:false,f:force};
  if(best&&bd<=best.r+1){best.hit=true;best.acc=Math.max(0,1-bd/(best.r+1));hole.ok=true;
    if(best.f&&force!==best.f){best.acc*=0.4;toast(`力度不对：要${best.f}，扎成了${force}`,0.9)}
    else toast(best.acc>0.85?'完美正中！':best.acc>0.5?'很准':'擦边',0.5)}
  else{P.wrong++;toast('扎歪了',0.6);if(navigator.vibrate)navigator.vibrate([40,40,40])}
  P.holes.push(hole);
  if(P.tg.every(t=>t.hit))setTimeout(finishPunch,350);
}
function finishPunch(){
  if(!P||P.done)return;P.done=true;
  const hit=P.tg.filter(t=>t.hit),acc=hit.length?hit.reduce((s,t)=>s+t.acc,0)/hit.length:0;
  const res={hit:hit.length,total:P.tg.length,missed:P.tg.length-hit.length,wrong:P.wrong,acc};
  if(P.counter)return deliver(res);
  $('gameUI').classList.add('hidden');$('tip').textContent='';$('lockB').classList.remove('on');
  const o=P.o;scene='town';P=null;spotResult(o,res);
}
function drawPunch(dt){
  if(P.counter){counterTick(dt);if(!P)return}else{P.t+=dt;if(P.t>=P.limit)finishPunch();if(!P)return}
  if(P.charging)P.charge+=dt;
  // move needle
  let ax=tiltAxis(raw.x-base.x,TUNE.invX),ay=tiltAxis(raw.y-base.y,TUNE.invY);
  if(keys.ArrowLeft)ax=-1;if(keys.ArrowRight)ax=1;if(keys.ArrowUp)ay=-1;if(keys.ArrowDown)ay=1;
  const spd=55*TUNE.speed/SodaTune.DEF.speed*(P.zoom===1?1:P.zoom===2?0.8:0.65);
  const k=Math.min(1,dt*TUNE.follow);P.v.x+=(ax*spd-P.v.x)*k;P.v.y+=(ay*spd-P.v.y)*k;
  const tr=2.2*TUNE.tremor*(1-[0,.22,.4,.55][aug('spine')])/Math.sqrt(P.zoom);
  P.trem.x+=(Math.random()-0.5)*tr*dt*30;P.trem.y+=(Math.random()-0.5)*tr*dt*30;P.trem.x*=0.92;P.trem.y*=0.92;
  P.n.x+=P.v.x*dt+P.trem.x*dt*6;P.n.y+=P.v.y*dt+P.trem.y*dt*6;
  if(P.lock){const dx=P.n.x-P.lock.x,dy=P.n.y-P.lock.y,d=Math.hypot(dx,dy),m=5;if(d>m){P.n.x=P.lock.x+dx/d*m;P.n.y=P.lock.y+dy/d*m}}
  P.n.x=Math.max(-60,Math.min(60,P.n.x));P.n.y=Math.max(-40,Math.min(40,P.n.y));
  // scene
  const z=P.zoom,band=P.counter?Math.round(LH*0.34):0,cx=P.counter?Math.round(LW*0.48):LW/2,cy=P.counter?Math.round(band+(LH-band)*0.47):LH/2,
    s=(P.counter?Math.max(0.8,Math.min(LW*0.4/92,(LH-band-8)*0.78/58)):Math.max(1,Math.min(LW/120,LH/80)))*z;
  const ox=z>1?-P.n.x*s:0,oy=z>1?-P.n.y*s:0;
  const W=(x,y)=>[cx+ox+x*s,cy+oy+y*s];
  const bg={biscuit:['#2E2040','#261A36'],hair:['#2f4a5e','#385a70'],tattoo:['#2a1f3a','#352848']}[P.kind];
  if(P.kind==='biscuit'){for(let x=0;x<LW;x+=13)R(x,0,12,LH,bg[0]),R(x+12,0,1,LH,bg[1]);
    // 传送带：慢慢往左走，黑孔里能看到它
    const by=Math.round(cy-31*s),bh=Math.round(62*s);P.belt=(P.belt||0)+dt*10;P.beltY=[by,bh];
    R(0,by-2,LW,bh+4,'#1A1026');for(let x=-((P.belt|0)%11);x<LW;x+=11)R(x,by,10,bh,'#3A3348'),R(x+10,by,1,bh,'#322B40');}
  else for(let y=0;y<LH;y+=8)for(let x=0;x<LW;x+=8)R(x,y,8,8,((x+y)/8)%2?bg[0]:bg[1]);
  if(P.counter)drawCounterBand();
  const box=(x,y,w,h,c)=>{const [a,b]=W(x,y);R(a,b,Math.ceil(w*s),Math.ceil(h*s),c)};
  if(P.kind==='biscuit'){lx.globalAlpha=0.45;box(-44,-27,92,58,'#1A1026');lx.globalAlpha=1;
    box(-46,-29,92,58,'#2B1B3D');box(-44,-27,88,54,'#B9772F');for(let i=0;i<9;i++)box(-40+i*10,-29,2.6,1.3,'#2B1B3D');
    box(-41,-24,82,48,'#E8B460');box(-41,-24,82,2,'#F5CE85');box(-41,22,82,2,'#D49A47');
    [[-34,-19,4,2],[18,-21,5,2],[30,13,4,2],[-6,17,6,2],[-22,9,3,1.4],[8,-2,3,1.4],[-38,2,3,1.4]].forEach(([x,y,w,h])=>box(x,y,w,h,'#D49A47'));
    lx.globalAlpha=0.75;[[-28,-17],[2,-20],[34,-6],[-36,17],[12,19],[-14,-4],[24,4]].forEach(([x,y])=>box(x,y,0.8,0.8,'#FFF4D6'));lx.globalAlpha=1}
  else if(P.kind==='hair'){for(let y=-32;y<=24;y++){const w=40*Math.sqrt(Math.max(0,1-(y+4)*(y+4)/(28*28)));box(-w,y,w*2,1,y<-24?'#f2b8a0':'#f7c9b2')}
    box(-30,8,8,3,'#5a3b22');box(22,8,8,3,'#5a3b22');}
  else{box(-46,-32,92,62,'#d99a74');box(-46,-32,92,3,'#e8b08c');box(-46,27,92,3,'#b87a58')}
  // targets
  P.scr=[];
  P.tg.forEach(t=>{if(t.hit)return;const [a,b]=W(t.x,t.y),r=t.r*s;
    if(P.kind==='biscuit'){disc(a,b,r,'#F0C374');dashRing(a,b,r,'#2B1B3D',P.t);R(a-1,b-1,2,2,'#2B1B3D');P.scr.push({x:a+r*0.75,y:b-r*1.05,f:t.f});return}
    lx.fillStyle='#ffffffcc';for(let i=0;i<16;i+=2){const an=i/16*Math.PI*2+P.t;lx.fillRect(Math.round(a+Math.cos(an)*r),Math.round(b+Math.sin(an)*r),Math.max(1,s/2|0),Math.max(1,s/2|0))}});
  // holes
  if(P.kind==='tattoo'){const ok=P.holes.filter(h=>h.ok);lx.strokeStyle='#2b1f45';lx.lineWidth=Math.max(1,s*0.8);lx.beginPath();ok.forEach((h,i)=>{const [a,b]=W(h.x,h.y);i?lx.lineTo(a,b):lx.moveTo(a,b)});lx.stroke()}
  P.holes.forEach(h=>{const [a,b]=W(h.x,h.y),r=Math.max(1,Math.round(1.6*s));
    if(P.kind==='biscuit')return hole(a,b,5.2*s,h.f||'黑',!h.ok);
    if(P.kind==='hair'&&h.ok){R(a-r/2,b-r/2,r,r,'#5a3b22');R(a-1,b-4*s,Math.max(1,s/2|0),4*s,'#3a2414');R(a+s,b-3*s,Math.max(1,s/2|0),3*s,'#3a2414')}
    else R(a-r/2,b-r/2,r,r,h.ok?(P.kind==='tattoo'?'#2b1f45':'#6a3d12'):'#c4473a')});
  // needle
  const [na,nb]=W(P.n.x,P.n.y),nr=Math.max(3,Math.round(1.6*s));
  if(P.lock){const [la,lb]=W(P.lock.x,P.lock.y);lx.strokeStyle='#7fb0ff88';lx.lineWidth=1;lx.beginPath();lx.arc(la,lb,5*s,0,7);lx.stroke()}
  if(P.kind==='biscuit'){const rr=Math.round(4.2*s);
    if(P.charging){const f=forceOf(P.charge),q=Math.min(1,P.charge/(0.9*(1-[0,.25,.4,.55][aug('pump')])));
      arcPx(na,nb,rr+3,q,{白:'#FFF4D6',灰:'#9A93AE',黑:'#2B1B3D'}[f],2)}
    ringPx(na,nb,rr,'#2B1B3D',3);ringPx(na,nb,rr,'#FFD23F',1);
    [[0,-rr-4,2,3],[0,rr+2,2,3],[-rr-4,0,3,2],[rr+2,0,3,2]].forEach(([x,y,w,h])=>{R(na+x-1,nb+y-1,w+2,h+2,'#2B1B3D');R(na+x,nb+y,w,h,'#FFD23F')});
    R(na,nb,1,1,'#2B1B3D');return}
  lx.strokeStyle='#ffd23f';lx.lineWidth=Math.max(1,s/2|0);lx.beginPath();lx.arc(Math.round(na),Math.round(nb),nr,0,7);lx.stroke();
  R(na,nb,1,1,'#fff');
  R(na+nr,nb-nr-14*Math.min(2,s/2),Math.max(2,s),14*Math.min(2,s/2),'#c9d2e0');
}
// 像素圆、虚线圈、孔
function disc(cx,cy,r,c){cx=Math.round(cx);cy=Math.round(cy);const n=Math.round(r);for(let y=-n;y<=n;y++){const w=Math.round(Math.sqrt(Math.max(0,r*r-y*y)));if(w>0)R(cx-w,cy+y,w*2,1,c)}}
function ringPx(cx,cy,r,c,th=1){const n=Math.max(16,Math.round(r*7));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;R(Math.round(cx+Math.cos(a)*r-th/2),Math.round(cy+Math.sin(a)*r-th/2),th,th,c)}}
function arcPx(cx,cy,r,q,c,th=1){const n=Math.max(16,Math.round(r*7));for(let i=0;i<n*q;i++){const a=-Math.PI/2+i/n*Math.PI*2;R(Math.round(cx+Math.cos(a)*r-th/2),Math.round(cy+Math.sin(a)*r-th/2),th,th,c)}}
function dashRing(cx,cy,r,c,t){const n=Math.max(16,Math.round(r*7));for(let i=0;i<n;i++){if(Math.floor(i/(n/14)+t*2)%2)continue;const a=i/n*Math.PI*2;R(Math.round(cx+Math.cos(a)*r-1),Math.round(cy+Math.sin(a)*r-1),2,2,c)}}
// 打好的孔：棕色孔壁加深色孔心；黑孔透出底下的传送带，右下一道亮边。白孔只是浅坑，灰孔不透
function hole(a,b,r,f,bad){
  if(f==='白'){disc(a,b,r*0.85,'#C98B45');disc(a+r*0.08,b+r*0.1,r*0.55,'#D9A860')}
  else if(f==='灰'){disc(a,b,r,'#9A642C');disc(a,b,r*0.72,'#6A4520');disc(a+r*0.1,b+r*0.12,r*0.42,'#4A2E14');R(a-r*0.6,b-r*0.85,r*0.45,1,'#5E3B1A')}
  else{disc(a,b,r,'#9A642C');disc(a,b,r*0.78,'#2B1B3D');
    const belt=((Math.round(a)+(P.belt|0))%11+11)%11<10?'#3A3348':'#322B40';disc(a+r*0.1,b+r*0.14,r*0.5,belt);
    R(a-r*0.6,b-r*0.9,r*0.45,1,'#5E3B1A');R(a+r*0.3,b+r*0.78,r*0.45,1,'#F5CE85')}
  if(bad)ringPx(a,b,r+1,'#E5484D',1)}
function punchHud(){
  if(!P)return;if(P.counter)return counterHud();ctx.save();const fs=14*DPR;ctx.font=`900 ${fs}px -apple-system,"PingFang SC",sans-serif`;ctx.textBaseline='top';
  const left=Math.ceil(P.limit-P.t),done=P.tg.filter(t=>t.hit).length;
  const t=`${SHOPS[P.kind].name}${P.o.custom?' · 定制单':''}   剩 ${left} 秒   ${done}/${P.tg.length}   扎歪 ${P.wrong}`;
  ctx.lineWidth=4*DPR;ctx.strokeStyle='#0e0a18';ctx.strokeText(t,10*DPR,10*DPR);ctx.fillStyle='#fff8e6';ctx.fillText(t,10*DPR,10*DPR);ctx.restore();
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  lx.clearRect(0,0,LW,LH);
  if(scene==='punch'&&P)drawPunch(dt);else if(scene==='home')drawHome(dt);else VIEW==='side'?drawSide(dt):drawTown(dt);
  ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,cv.width,cv.height);

}
resize();hud();welcome();requestAnimationFrame(frame);
