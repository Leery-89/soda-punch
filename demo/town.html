<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>奶龙小镇 demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700;900&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#241733;color:#FFF4D6;font-family:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
  #hud{position:fixed;left:8px;right:8px;top:calc(6px + env(safe-area-inset-top));display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;z-index:2}
  .chip{background:#3D2A5C;border:3px solid #2B1B3D;box-shadow:inset 0 0 0 2px #5B4580,0 3px 0 #1A1026;padding:3px 9px;font-size:13px;font-weight:700}
  .num{font-family:Silkscreen,monospace;font-weight:400}
  .chip b{color:#ffd23f}
  #edict{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(6px + env(safe-area-inset-top));font-size:12px;color:#FFF4D6;max-width:46vw}
  .px{background:#FFD23F;color:#2B1B3D;border:4px solid #2B1B3D;box-shadow:inset -4px -4px 0 #D9A400,inset 4px 4px 0 #FFF0A0,0 5px 0 #1A1026;padding:8px 16px;min-height:44px;font-size:18px;font-weight:400;font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif;cursor:pointer;white-space:nowrap}
  .px:active{transform:translateY(4px);box-shadow:inset -4px -4px 0 #D9A400,inset 4px 4px 0 #FFF0A0,0 1px 0 #1A1026}
  .px.gray{background:#5B4580;color:#FFF4D6;box-shadow:inset -4px -4px 0 #3D2A5C,inset 4px 4px 0 #8C73B5,0 5px 0 #1A1026}
  .px.blue{background:#4AA3DF;color:#fff;box-shadow:inset -4px -4px 0 #2E7BB0,inset 4px 4px 0 #A6DBFF,0 5px 0 #1A1026}
  .px[disabled]{opacity:.45}
  .panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1A1026b0;z-index:5;padding:16px;box-sizing:border-box}
  .card{width:min(100%,460px);max-height:100%;overflow:auto;background:#3D2A5C;border:4px solid #2B1B3D;box-shadow:inset 0 0 0 3px #5B4580,0 6px 0 #1A1026;padding:16px;text-align:center;line-height:1.55;box-sizing:border-box}
  .card h2{margin:0 0 6px;color:#FFD23F;font-size:24px;font-weight:400;font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif}
  .card p{margin:6px 0;font-size:14px;color:#FFF4D6;text-align:left}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .up{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#2B1B3D;padding:8px;margin:6px 0;text-align:left;font-size:13px}
  .up b{color:#ffd23f}
  .big{font-size:56px;line-height:1.1;margin:6px 0}
  .ledger{width:100%;font-size:14px;border-collapse:collapse;margin:6px 0}
  .ledger td{padding:3px 4px;border-bottom:2px dashed #5B4580}.ledger td:last-child{text-align:right}
  .bubble{display:inline-block;background:#fff8e6;color:#2b1f45;border:3px solid #0e0a18;padding:8px 12px;font-weight:800;font-size:15px;margin:6px 0}
  .pad{position:fixed;border:4px solid #2B1B3D;font-weight:400;font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent;z-index:3;width:76px;height:76px;font-size:22px}
  #lockB{right:calc(126px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));background:#4AA3DF;color:#fff;box-shadow:inset -5px -5px 0 #2E7BB0,inset 5px 5px 0 #A6DBFF,0 6px 0 #1A1026}
  #lockB.on{background:#A6DBFF;color:#2B1B3D;transform:translateY(4px)}
  #zoomB{left:calc(14px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));width:60px;height:60px;font-size:15px;line-height:1.1;background:#5B4580;color:#FFF4D6;box-shadow:inset -4px -4px 0 #3D2A5C,inset 4px 4px 0 #8C73B5,0 5px 0 #1A1026}
  #punchB{right:calc(14px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));width:100px;height:100px;font-size:30px;background:#FFD23F;color:#2B1B3D;box-shadow:inset -6px -6px 0 #D9A400,inset 6px 6px 0 #FFF0A0,0 6px 0 #1A1026}
  #punchB:active,#zoomB:active{transform:translateY(4px)}
  #gameTop{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;z-index:3;align-items:center}
  #gameTop button{font-size:15px;padding:4px 10px;min-height:40px}
  #rVal{font-family:Silkscreen,monospace;font-weight:400;color:#FFD23F}
  /* 饼干店营业界面（照 shop.html）：自己一张高清画布 #sc，按钮都在 #shopUI 里 */
  #sc{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
  #sSafe{position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  body.shop #c,body.shop #hud,body.shop #tip,body.shop #toast{display:none!important}
  #shopUI .chip{background:#3D2A5C;border:3px solid #2B1B3D;box-shadow:inset 0 0 0 2px #5B4580,0 3px 0 #1A1026;padding:3px 9px;font-size:13px;font-weight:700}
  #shopUI .px{font-weight:400;font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif}
  /* 右上：售价比 */
  #sTop{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:4px;z-index:3;align-items:center}
  #sTop .px{font-size:18px;padding:2px 8px;min-width:44px;min-height:44px}
  #sRVal{font-family:Silkscreen,"Noto Sans SC",monospace;font-weight:400;color:#FFD23F;font-size:14px;padding:6px 10px}
  /* 左边：固定在左下角，上面竖排 陀螺仪设置 / 重新校准；右边：打孔，上面是交货 */
  #shopUI .side{position:fixed;left:calc(14px + env(safe-area-inset-left));width:110px;font-size:15px!important;min-height:44px;height:44px;padding:2px 6px!important;z-index:3}
  #sCalB{bottom:calc(108px + env(safe-area-inset-bottom))}#sTuneB{bottom:calc(162px + env(safe-area-inset-bottom))} /* resize() 会按柜台高度收紧 */
  #sGiveB{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(132px + env(safe-area-inset-bottom));width:100px;font-size:15px!important;min-height:44px;height:44px;padding:2px 6px!important;z-index:3}
  /* 左下：固定；右下：打孔，打孔左边：放大（装了火眼才有） */
  #shopUI .pad{position:fixed;border:4px solid #2B1B3D;font-weight:400;font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent;z-index:3;width:76px;height:76px;font-size:22px;padding:0}
  #sLockB{left:calc(14px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));background:#4AA3DF;color:#fff;box-shadow:inset -5px -5px 0 #2E7BB0,inset 5px 5px 0 #A6DBFF,0 6px 0 #1A1026}
  #sLockB.on{background:#A6DBFF;color:#2B1B3D;transform:translateY(4px)}
  #sZoomB{right:calc(130px + env(safe-area-inset-right));bottom:calc(36px + env(safe-area-inset-bottom));width:60px;height:60px;font-size:15px;line-height:1.1;background:#5B4580;color:#FFF4D6;box-shadow:inset -4px -4px 0 #3D2A5C,inset 4px 4px 0 #8C73B5,0 5px 0 #1A1026}
  #sPunchB{right:calc(14px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));width:100px;height:100px;font-size:30px;background:#FFD23F;color:#2B1B3D;box-shadow:inset -6px -6px 0 #D9A400,inset 6px 6px 0 #FFF0A0,0 6px 0 #1A1026}
  #sPunchB.on,#sZoomB:active{transform:translateY(4px)}
  #sToast{position:fixed;left:48%;top:34%;transform:translate(-50%,-50%);font-size:24px;font-family:'ZCOOL KuaiLe',sans-serif;color:#FFD23F;text-shadow:3px 3px 0 #2B1B3D;pointer-events:none;z-index:6;opacity:0;transition:opacity .2s;white-space:nowrap}
  #toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:24px;font-family:'ZCOOL KuaiLe',sans-serif;color:#FFD23F;text-shadow:3px 3px 0 #2B1B3D;pointer-events:none;z-index:6;opacity:0;transition:opacity .2s;white-space:nowrap}
  #tip{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;color:#d9cdf0;text-shadow:2px 2px 0 #0e0a18;pointer-events:none;z-index:2;text-align:center;width:min(70vw,460px)}
  #dlg{position:fixed;inset:0;z-index:7}
  #dlgBox{position:absolute;left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));min-height:26%;background:#FFF4D6;color:#2B1B3D;border:4px solid #2B1B3D;box-shadow:inset 0 0 0 3px #FFD23F,0 6px 0 #1A1026;padding:30px 18px 14px;box-sizing:border-box}
  #dlgName{position:absolute;left:10px;top:-22px;background:#FFD23F;border:4px solid #2B1B3D;padding:2px 18px;font-family:"ZCOOL KuaiLe",sans-serif;font-size:20px}
  #dlgText{margin:0;font-size:18px;line-height:1.6;font-weight:700}
  #dlgMore{position:absolute;right:12px;bottom:6px;font-size:12px;color:#8a7a6a}
  #pL,#pR{position:absolute;bottom:calc(10px + 26% - 4px);height:min(44vh,240px);image-rendering:pixelated}
  #pL{left:calc(16px + env(safe-area-inset-left))}#pR{right:calc(16px + env(safe-area-inset-right))}
  #rot{position:fixed;inset:0;z-index:20;background:#1b1430;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:18px;font-weight:900;color:#ffd23f;text-align:center}
  #rot div{font-size:64px;animation:spin 1.6s ease-in-out infinite}
  @keyframes spin{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
  .hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span class="chip" style="display:flex;align-items:center;gap:5px"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#fff8e6" stroke="#0e0a18" stroke-width="2.5"/><line id="clkH" x1="10" y1="10" x2="10" y2="6" stroke="#0e0a18" stroke-width="2.2" stroke-linecap="round"/><line id="clkM" x1="10" y1="10" x2="10" y2="4" stroke="#0e0a18" stroke-width="1.6" stroke-linecap="round"/></svg><b id="hTime" class="num">08:00</b> 第 <b id="hDay">1</b> 天</span>
  <span class="chip">金币 <b id="hCoin" class="num">0</b></span>
  <span class="chip">口碑 <b id="hRep">0</b></span>
  <span class="chip" id="edict"></span>
</div>
<div id="tip"></div>
<div id="rot"><div>📱</div>这一版是横屏的，请把手机横过来</div>
<div id="toast"></div>
<div id="dlg" class="hidden"><canvas id="pL" width="36" height="40"></canvas><canvas id="pR" width="36" height="40"></canvas><div id="dlgBox"><span id="dlgName"></span><p id="dlgText"></p><span id="dlgMore">▼ 点一下继续</span></div></div>

<div id="gameUI" class="hidden">
  <div id="gameTop"><button class="px gray" id="calB">重新校准</button><button class="px gray" id="tuneB">陀螺仪设置</button><button class="px gray" id="giveupB">交货</button></div>
  <button id="lockB" class="pad">固定</button>
  <button id="zoomB" class="pad hidden">放大<br>1×</button>
  <button id="punchB" class="pad">打孔</button>
</div>

<canvas id="sc" class="hidden"></canvas>
<div id="sSafe"></div>
<div id="sToast"></div>
<div id="shopUI" class="hidden">
  <div id="sTop"><button class="px gray" id="sRDn">−</button><b id="sRVal" class="chip"></b><button class="px gray" id="sRUp">＋</button></div>
  <button class="px gray side" id="sTuneB">陀螺仪设置</button>
  <button class="px gray side" id="sCalB">重新校准</button>
  <button class="px gray" id="sGiveB">交货</button>
  <button id="sLockB" class="pad">固定</button>
  <button id="sZoomB" class="pad hidden">放大<br>1×</button>
  <button id="sPunchB" class="pad">打孔</button>
</div>

<div class="panel" id="panel"><div class="card" id="card"></div></div>

<script src="../tune.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const lc=document.createElement('canvas'),lx=lc.getContext('2d');
let S=3,LW=200,LH=120,DPR=1;
// 已定：俯视角、只横屏（h）。留着 ?view=side 横版侧视、?view=top 横竖屏都行 两个对比版本
const VIEW=(()=>{const v=new URLSearchParams(location.search).get('view');return ['top','h','side'].includes(v)?v:'h'})();
let CAM=0,GY=100,WORLD=400;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;
  S=Math.max(2,Math.floor(Math.min(innerWidth,innerHeight)/120));
  LW=Math.ceil(innerWidth/S);LH=Math.ceil(innerHeight/S);
  lc.width=LW;lc.height=LH;
  $('rot').style.display=VIEW!=='top'&&innerHeight>innerWidth?'flex':'none';
  VIEW==='side'?layoutSide():layoutTown();
}
addEventListener('resize',resize);

// ---------- save ----------
const SHOPS={
  home:{name:'主角家',desc:'奶帝十字架：进义体诊所给自己装义体'},
  biscuit:{name:'饼干店',desc:'给苏打饼干打孔，接定制单',base:20},
  hair:{name:'植发店',desc:'在头皮上打又小又密的孔',base:35,price:150},
  tattoo:{name:'纹身店',desc:'沿图案一针一针扎出纹身',base:50,price:250},
};
const SHOP_UPS=[
  {k:'sign',name:'招牌',eff:'估值 +20%',cost:[100,220,450]},
  {k:'bell',name:'门铃',eff:'每天多来 1 单',cost:[80,200]},
];
const EDICTS=[
  {t:'今天让一位客人超满意（超赞或抢着买）',r:30,ok:d=>d.best>=4},
  {t:'今天不许有客人生气',r:20,ok:d=>d.orders>0&&d.angry===0},
  {t:'今天卖出 3 单',r:15,ok:d=>d.orders>=3},
  {t:'今天赚到 80 金币',r:25,ok:d=>d.rev>=80},
];
const DEF={day:1,coins:50,rep:0,open:{home:1,biscuit:1,hair:0,tattoo:0},up:{wrist:0,zoom:0,night:0,sign:0,bell:0},edict:0,sess:0,clock:480,phase:'day',ratio:1};
let G=(()=>{try{const s=JSON.parse(localStorage.getItem('nailongTown6')||'null');if(s)return Object.assign({},DEF,s)}catch(e){}return JSON.parse(JSON.stringify(DEF))})();
let D={orders:0,rev:0,angry:0,best:0,tips:0,mat:0,gold:0,jade:0};
function save(){try{localStorage.setItem('nailongTown6',JSON.stringify(G))}catch(e){}}
// ---------- 奶帝十字架 → 义体诊所（demo/clinic.html）。金币两边共用，装上的义体在这里生效 ----------
const clinicSave=()=>{try{return JSON.parse(localStorage.getItem('nailongClinic1')||'null')}catch(e){return null}};
(()=>{const c=clinicSave();if(G.atClinic&&c&&c.coins!=null)G.coins=c.coins;delete G.atClinic;save()})();
// 装在插槽里的义体才算数，返回档位 0–3
function aug(k){const c=clinicSave();if(!c||!c.sock)return 0;return Object.values(c.sock).some(a=>a.includes(k))?(c.own[k]||0):0}
function goClinic(){const c=clinicSave();
  if(c){c.coins=G.coins;c.open={hair:!!G.open.hair,tattoo:!!G.open.tattoo};try{localStorage.setItem('nailongClinic1',JSON.stringify(c))}catch(e){}}
  G.atClinic=1;save();location.href='clinic.html'}
function fmtClock(m){m=Math.round(m);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function setClock(m){G.clock=m;const h=(m/60)%12,mi=m%60;
  const hand=(id,a,l)=>{const e=$(id);e.setAttribute('x2',10+Math.sin(a)*l);e.setAttribute('y2',10-Math.cos(a)*l)};
  hand('clkH',h/12*Math.PI*2,4.5);hand('clkM',mi/60*Math.PI*2,6.5);$('hTime').textContent=fmtClock(m)}
function hud(){setClock(G.clock);$('hDay').textContent=G.day;$('hCoin').textContent=G.coins;$('hRep').textContent=G.rep;
  $('edict').textContent=G.phase==='night'?'打烊了 · 找镇民聊天，或回家':G.sess===1&&G.clock>=12*60&&G.clock<13*60?'午休 · 13:00 下午场 · 还能营业 1 次':'今天还能营业 '+(2-G.sess)+' 次 · 公告板看旨意'}
function toast(t,s=1.2){const el=$('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.opacity=0,s*1000)}

// ---------- 像素角色图（策划案/像素角色，原尺寸 PNG，最近邻放大） ----------
const SPR={};['needle','god','redbaby','dog','nailong'].forEach(k=>{const im=new Image();im.src='img/'+k+'.png';SPR[k]=im});
const NPC_KINDS=['redbaby','dog'],KIND_NAME={redbaby:'红温奶娃',dog:'奶狗',nailong:'奶龙'}; // nailong = 通用奶龙（NPC 6000），没单独设计的路人和普通顾客都用它
// 时间写在颜色里：早上偏暖，17 点后橙红，19 点后压暗
function tintAt(m){return m>=19*60?['#0b0b3a',0.55]:m>=17*60?['#FF5A1F',0.26]:m<10*60?['#FFB347',0.07]:null}
const tintCache={};
function sprite(k,t){const im=SPR[k];if(!im||!im.complete||!im.naturalWidth)return null;if(!t)return im;
  const key=k+t[0]+t[1];if(tintCache[key])return tintCache[key];
  const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext('2d');
  g.drawImage(im,0,0);g.globalCompositeOperation='source-atop';g.globalAlpha=t[1];g.fillStyle=t[0];g.fillRect(0,0,c.width,c.height);
  return tintCache[key]=c}
// 角色画在高清层：px = 每个设定图像素占几个屏幕像素（整数，保证像素清楚）
function sprPx(f=1){return Math.max(1,Math.round(Math.min(innerWidth,innerHeight)/312*DPR*f))}
function drawSprite(k,x,y,px,o={}){ // x,y = 脚底中心（屏幕设备像素）
  const im=sprite(k,o.tint);if(!im)return;const w=im.width*px,h=im.height*px,b=o.bob?Math.round(Math.abs(Math.sin(o.bob*10))*px*1.5):0;
  ctx.save();ctx.imageSmoothingEnabled=false;ctx.globalAlpha=o.alpha??1;
  if(o.flip){ctx.translate(Math.round(x),0);ctx.scale(-1,1);ctx.drawImage(im,Math.round(-w/2),Math.round(y-h-b),w,h)}
  else ctx.drawImage(im,Math.round(x-w/2),Math.round(y-h-b),w,h);ctx.restore()}
function sprH(k,f=1){const im=SPR[k];return (im&&im.naturalHeight||40)*sprPx(f)/DPR/S} // 低清坐标里的高度，用来点中角色
// ---------- pixel helpers ----------
function R(x,y,w,h,c){lx.fillStyle=c;lx.fillRect(Math.round(x),Math.round(y),w,h)}
function nailong(x,y,mood=0,t=0,scale=1,needle=true){ // x,y = feet center
  const s=scale,b=t?Math.round(Math.sin(t*12)*0.6):0;
  const P=(px,py,w,h,c)=>R(x+px*s,y+(py+b)*s,w*s,h*s,c);
  P(-6,-12,12,11,'#ffd23f');P(-7,-10,1,8,'#ffd23f');P(6,-10,1,8,'#ffd23f');P(-5,-13,10,1,'#ffd23f');
  P(-6,-2,12,1,'#e0a800');P(-4,-1,3,1,'#e0a800');P(1,-1,3,1,'#e0a800');
  P(-3,-9,8,6,'#fff2c0');
  // needle on head
  if(needle){P(0,-19,1,6,'#c9d2e0');P(-1,-15,3,2,'#7fb0ff');P(0,-20,1,1,'#ffffff')}

    if(!active){requestAnimationFrame(frame);return}
    const paused=H>W||document.hidden||SodaTune.isOpen(); // 竖屏 / 切后台 / 开着陀螺仪设置：钟和耐心都停
    if(running&&!paused){counterTick(dt);if(running){moveNeedle(dt);animTick(dt)}}
    if(!paused){TT+=dt;P.belt+=dt*(running?12:6)} // 传送带一直慢慢走
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
    drawBelt();
    const [sx,sy]=drawPunchArea();
    drawCounterBand();
    if(running)drawNeedle(sx,sy);
    drawHud();
    if(running&&P.plunge>.7&&!REDUCE){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=`rgba(255,226,90,${(P.plunge-.7)*.25})`;ctx.fillRect(0,0,cv.width,cv.height)} // 扎下去那一下淡黄闪光
    requestAnimationFrame(frame);
  }
  resize();requestAnimationFrame(frame);
  window.ShopMode={start:startSession,tuneOpen(){chargeCancel();if(P)P.lock=null;$('lockB').classList.remove('on')},tuneClose(){last=performance.now()},state:()=>({C,P,LY,running})}; // state 给测试用
})();
</script>
</body>
</html>
