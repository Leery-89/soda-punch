<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>奶龙小镇 demo</title>
<style>
  html,body{margin:0;height:100%;background:#1b1430;color:#fff8e6;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
  #hud{position:fixed;left:8px;right:8px;top:calc(6px + env(safe-area-inset-top));display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;z-index:2}
  .chip{background:#2b1f45;border:3px solid #0e0a18;box-shadow:inset -3px -3px 0 #1d1530,inset 3px 3px 0 #4a3a6e;padding:3px 8px;font-size:13px;font-weight:800}
  .chip b{color:#ffd23f}
  #edict{flex-basis:100%;font-size:12px;color:#ffe9a8}
  .px{background:#ffd23f;color:#3a2a00;border:3px solid #0e0a18;box-shadow:inset -4px -4px 0 #c99a10,inset 4px 4px 0 #fff2b0;padding:9px 16px;font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;white-space:nowrap}
  .px:active{transform:translateY(2px)}
  .px.gray{background:#8d86a3;color:#1b1430;box-shadow:inset -4px -4px 0 #5f5875,inset 4px 4px 0 #c9c3dc}
  .px.blue{background:#5aa9ff;color:#0b2140;box-shadow:inset -4px -4px 0 #2f6fc0,inset 4px 4px 0 #bfe0ff}
  .px[disabled]{opacity:.45}
  .panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0818c0;z-index:5;padding:16px;box-sizing:border-box}
  .card{width:min(100%,440px);max-height:100%;overflow:auto;background:#2b1f45;border:4px solid #0e0a18;box-shadow:inset -5px -5px 0 #1d1530,inset 5px 5px 0 #4a3a6e;padding:16px;text-align:center;line-height:1.55;box-sizing:border-box}
  .card h2{margin:0 0 6px;color:#ffd23f;font-size:20px}
  .card p{margin:6px 0;font-size:14px;color:#e6dcf5;text-align:left}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .up{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1d1530;padding:8px;margin:6px 0;text-align:left;font-size:13px}
  .up b{color:#ffd23f}
  .big{font-size:56px;line-height:1.1;margin:6px 0}
  .ledger{width:100%;font-size:14px;border-collapse:collapse;margin:6px 0}
  .ledger td{padding:3px 4px;border-bottom:2px dashed #4a3a6e}.ledger td:last-child{text-align:right}
  .bubble{display:inline-block;background:#fff8e6;color:#2b1f45;border:3px solid #0e0a18;padding:8px 12px;font-weight:800;font-size:15px;margin:6px 0}
  .pad{position:fixed;border:3px solid #0e0a18;font-weight:900;font-family:inherit;touch-action:none;-webkit-tap-highlight-color:transparent;z-index:3;width:84px;height:84px;font-size:18px}
  #lockB{left:calc(16px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));background:#5aa9ff;color:#0b2140;box-shadow:inset -5px -5px 0 #2f6fc0,inset 5px 5px 0 #bfe0ff}
  #lockB.on{background:#bfe0ff}
  #zoomB{right:calc(112px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));width:64px;height:64px;font-size:14px;background:#4a3a6e;color:#ffd23f;box-shadow:inset -4px -4px 0 #2b1f45,inset 4px 4px 0 #6d5a96}
  #punchB{right:calc(16px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));background:#ffd23f;color:#3a2a00;box-shadow:inset -5px -5px 0 #c99a10,inset 5px 5px 0 #fff2b0}
  #punchB:active,#zoomB:active{transform:translateY(2px)}
  #gameTop{position:fixed;right:8px;top:calc(6px + env(safe-area-inset-top));display:flex;gap:6px;z-index:3}
  #gameTop button{font-size:12px;padding:5px 8px}
  #toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:22px;font-weight:900;color:#ffd23f;text-shadow:3px 3px 0 #0e0a18;pointer-events:none;z-index:6;opacity:0;transition:opacity .2s;white-space:nowrap}
  #tip{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;color:#d9cdf0;text-shadow:2px 2px 0 #0e0a18;pointer-events:none;z-index:2;text-align:center;width:min(70vw,460px)}
  .hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span class="chip">第 <b id="hDay">1</b></span>
  <span class="chip">金币 <b id="hCoin">0</b></span>
  <span class="chip">口碑 <b id="hRep">0</b></span>
  <span class="chip" id="edict"></span>
</div>
<div id="tip"></div>
<div id="toast"></div>

<div id="gameUI" class="hidden">
  <div id="gameTop"><button class="px gray" id="calB">重新校准</button><button class="px gray" id="giveupB">交货</button></div>
  <button id="lockB" class="pad">固定</button>
  <button id="zoomB" class="pad hidden">放大<br>1×</button>
  <button id="punchB" class="pad">打孔</button>
</div>

<div class="panel" id="panel"><div class="card" id="card"></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const lc=document.createElement('canvas'),lx=lc.getContext('2d');
let S=3,LW=200,LH=120,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;
  S=Math.max(2,Math.floor(Math.min(innerWidth,innerHeight)/120));
  LW=Math.ceil(innerWidth/S);LH=Math.ceil(innerHeight/S);
  lc.width=LW;lc.height=LH;
  layoutTown();
}
addEventListener('resize',resize);

// ---------- save ----------
const SHOPS={
  home:{name:'主角家',desc:'十字架神台：祈祷让上帝改造升级'},
  biscuit:{name:'饼干店',desc:'给苏打饼干打孔，接定制单',base:20},
  hair:{name:'植发店',desc:'在头皮上打又小又密的孔',base:35,price:150},
  tattoo:{name:'纹身店',desc:'沿图案一针一针扎出纹身',base:50,price:250},
};
const UPS=[
  {k:'wrist',name:'钢铁手腕',eff:'手抖 −35%',cost:[80,180]},
  {k:'zoom',name:'高倍放大镜',eff:'解锁放大键：放大后针头变慢、看得更清',cost:[120,300]},
  {k:'night',name:'夜猫子基因',eff:'每块打孔时间 +5 秒',cost:[60,140]},
];
const SHOP_UPS=[
  {k:'sign',name:'招牌',eff:'估值 +20%',cost:[100,220,450]},
  {k:'bell',name:'门铃',eff:'每天多来 1 单',cost:[80,200]},
];
const EDICTS=[
  {t:'今天让一位客人超满意（超赞或抢着买）',r:30,ok:d=>d.best>=4},
  {t:'今天不许有客人生气',r:20,ok:d=>d.orders>0&&d.angry===0},
  {t:'今天卖出 3 单',r:15,ok:d=>d.orders>=3},
  {t:'今天赚到 80 金币',r:25,ok:d=>d.rev>=80},
];
const DEF={day:1,coins:50,rep:0,open:{home:1,biscuit:1,hair:0,tattoo:0},up:{wrist:0,zoom:0,night:0,sign:0,bell:0},edict:0,opened:false,phase:'day',ratio:1};
let G=(()=>{try{const s=JSON.parse(localStorage.getItem('nailongTown4')||'null');if(s)return Object.assign({},DEF,s)}catch(e){}return JSON.parse(JSON.stringify(DEF))})();
let D={orders:0,rev:0,angry:0,best:0,tips:0,mat:0};
function save(){try{localStorage.setItem('nailongTown4',JSON.stringify(G))}catch(e){}}
function hud(){$('hDay').textContent=G.day+(G.phase==='night'?' 天 · 晚上🌙':' 天 · 白天☀️');$('hCoin').textContent=G.coins;$('hRep').textContent=G.rep;
  const e=EDICTS[G.edict];$('edict').textContent=G.phase==='night'?'🌙 晚上强化：主角家神台升级、饼干店升级店铺、开新店，然后睡觉':'✝ 上帝今日旨意：'+e.t+'（+'+e.r+' 金币）'}
function toast(t,s=1.2){const el=$('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.opacity=0,s*1000)}

// ---------- pixel helpers ----------
function R(x,y,w,h,c){lx.fillStyle=c;lx.fillRect(Math.round(x),Math.round(y),w,h)}
function nailong(x,y,mood=0,t=0,scale=1){ // x,y = feet center
  const s=scale,b=Math.round(Math.sin(t*10)*(mood===2?1:0));
  const P=(px,py,w,h,c)=>R(x+px*s,y+(py+b)*s,w*s,h*s,c);
  P(-6,-12,12,11,'#ffd23f');P(-7,-10,1,8,'#ffd23f');P(6,-10,1,8,'#ffd23f');P(-5,-13,10,1,'#ffd23f');
  P(-6,-2,12,1,'#e0a800');P(-4,-1,3,1,'#e0a800');P(1,-1,3,1,'#e0a800');
  P(-3,-9,8,6,'#fff2c0');
  // needle on head
  P(0,-19,1,6,'#c9d2e0');P(-1,-15,3,2,'#7fb0ff');P(0,-20,1,1,'#ffffff');
  if(mood===1){P(-4,-10,2,1,'#2b1f45');P(2,-10,2,1,'#2b1f45');P(-2,-6,4,2,'#c4473a');P(-1,-6,2,1,'#ff8a8a')}
  else{P(-4,-10,2,2,'#2b1f45');P(2,-10,2,2,'#2b1f45');P(-1,-6,2,1,'#2b1f45');P(-6,-7,2,1,'#ff9aa8');P(4,-7,2,1,'#ff9aa8')}
}

// ---------- town (top-down) ----------
let B=[],streets=[],deco=[],fountain=null,me={x:30,y:80,tx:30,ty:80,goal:null},townT=0,scene='town';
const BW=40,ROOF=20,WALL=12;
function rnd(seed){let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647}
function layoutTown(){
  const keys=['home','biscuit','hair','tattoo'];
  const top=Math.ceil(80/S),H=LH-top,land=LW>=LH*1.3;
  const cols=land?4:2,rows=land?1:2;
  const fronts=land?[top+Math.round(H*0.5)]:[top+Math.round(H*0.36),top+Math.round(H*0.78)];
  B=keys.map((k,i)=>{const r=Math.floor(i/cols),c=i%cols;return{k,x:Math.round(LW*(c+0.5)/cols),y:fronts[r],w:BW,h:ROOF+WALL}});
  streets=fronts.map(y=>({x:0,y:y+1,w:LW,h:10}));
  if(!land)streets.push({x:Math.round(LW/2)-5,y:fronts[0]+1,w:10,h:fronts[1]-fronts[0]+10});
  // plaza with God's fountain in the biggest open area
  if(land){const py=fronts[0]+11+Math.round((LH-fronts[0]-11)/2);fountain={x:Math.round(LW/2),y:py,r:Math.min(14,Math.round((LH-fronts[0]-11)/2)-3)};
    streets.push({x:Math.round(LW/2)-5,y:fronts[0]+1,w:10,h:py-fronts[0]})}
  else{fountain={x:Math.round(LW/2),y:Math.round((fronts[0]+11+fronts[1]-ROOF-WALL)/2),r:9}}
  if(fountain.r<6)fountain=null;
  // trees and flowers, kept off buildings, streets and the fountain
  const rand=rnd(7),free=(x,y,m)=>y>top+4&&!B.some(b=>x>b.x-b.w/2-m&&x<b.x+b.w/2+m&&y>b.y-b.h-m-6&&y<b.y+m)&&
    !streets.some(s=>x>s.x-m&&x<s.x+s.w+m&&y>s.y-m&&y<s.y+s.h+m)&&!(fountain&&Math.hypot(x-fountain.x,y-fountain.y)<fountain.r+m+4);
  deco=[];
  for(let i=0;i<400&&deco.filter(d=>d.t==='tree').length<Math.round(LW*LH/1400);i++){const x=rand()*LW,y=rand()*LH;
    if(free(x,y,7)&&free(x,y-12,7)&&!deco.some(d=>d.t==='tree'&&Math.hypot(d.x-x,d.y-y)<14))deco.push({t:'tree',x:Math.round(x),y:Math.round(y)})}
  for(let i=0;i<300&&deco.length<Math.round(LW*LH/500);i++){const x=rand()*LW,y=rand()*LH;
    if(free(x,y,2)&&!deco.some(d=>Math.hypot(d.x-x,d.y-y)<6))deco.push({t:'flower',x:Math.round(x),y:Math.round(y),c:['#ff7fa8','#fff4a8','#ffffff','#b48cff'][Math.floor(rand()*4)]})}
  deco.sort((a,b)=>a.y-b.y);
  if(!me.goal){const h=B[0];me.x=me.tx=h.x;me.y=me.ty=h.y+7}
}
function tree(x,y){
  lx.fillStyle='#0003';lx.beginPath();lx.ellipse(x+2,y+3,7,3,0,0,7);lx.fill();
  R(x-1,y-2,3,5,'#7a4a1a');
  const rows=[[-4,8],[-6,12],[-7,14],[-7,14],[-7,14],[-6,12],[-4,8]];
  rows.forEach(([o,w],i)=>R(x+o,y-12+i*1.4,w,2,i<2?'#5cc252':'#3f9b3a'));
  R(x-3,y-11,3,2,'#7fdc6e');R(x+2,y-7,2,1,'#2f7d2c');
}
function drawFountain(f){
  const {x,y,r}=f;
  for(let dy=-r;dy<=r;dy++){const w=Math.round(Math.sqrt(r*r-dy*dy)*1.3);R(x-w,y+dy*0.7,w*2,1,'#b9b0a0')}
  const ri=r-3;for(let dy=-ri;dy<=ri;dy++){const w=Math.round(Math.sqrt(ri*ri-dy*dy)*1.3);R(x-w,y+dy*0.7,w*2,1,'#5aa9ff')}
  for(let i=0;i<5;i++){const a=townT*2+i*1.3;R(x+Math.cos(a)*ri*0.9,y+Math.sin(a)*ri*0.5,1,1,'#ffffff')}
  // God's needle statue in the middle
  R(x-2,y-3,4,4,'#d8d0c0');R(x-1,y-14,2,11,'#e8e8f0');R(x-3,y-10,6,1,'#ffd23f');R(x,y-16,1,2,'#ffffff');
}
function building(b){
  const {k,x,y}=b,l=x-BW/2,wt=y-WALL,rt=wt-ROOF,locked=!G.open[k];
  const pal={home:['#f2e3c6','#c4473a','#a03328'],biscuit:['#ffe3b0','#ffd23f','#ffffff'],hair:['#e6f2ff','#5aa9ff','#3f86d6'],tattoo:['#6a5590','#7a4fa8','#64408c']}[k];
  R(l+3,rt+4,BW,ROOF+WALL,'#0003');
  // front wall
  R(l,wt,BW,WALL,pal[0]);R(l,y-1,BW,1,'#0002');
  R(x-3,y-9,6,9,'#5a3b22');R(x+1,y-5,1,1,'#ffd23f');
  R(l+5,wt+3,7,5,'#9fd8ff');R(l+5,wt+5,7,1,'#fff8');R(l+BW-12,wt+3,7,5,'#9fd8ff');R(l+BW-12,wt+5,7,1,'#fff8');
  // roof seen from above
  if(k==='biscuit'){for(let i=0;i<BW+4;i+=4)R(l-2+i,rt,2,ROOF+1,pal[1]),R(l+i,rt,2,ROOF+1,pal[2]);R(l-2,wt-1,BW+4,2,'#e0a800')}
  else{for(let i=0;i<ROOF;i+=3)R(l-2,rt+i,BW+4,3,i%6?pal[1]:pal[2]);R(l-2,rt+Math.round(ROOF/2),BW+4,1,'#0002');R(l-2,wt-1,BW+4,2,pal[2])}
  R(l-2,rt,BW+4,1,'#fff5');
  if(k==='home'){R(l+BW-10,rt-3,5,7,'#8a7a6a');R(l+BW-10,rt-3,5,1,'#5a4a3a');
    R(x-1,rt-8,3,14,'#ffd23f');R(x-4,rt-4,9,3,'#ffd23f');R(x,rt-8,1,14,'#fff2b0')}
  if(k==='biscuit'){R(x-9,wt-7,18,7,'#e8b46a');R(x-9,wt-7,18,1,'#f6cf8a');for(let i=0;i<4;i++)R(x-6+i*4,wt-5,1,1,'#7a4a1a'),R(x-6+i*4,wt-3,1,1,'#7a4a1a')}
  if(k==='hair'){for(let i=0;i<9;i++)R(x+6,y-10+i,2,1,['#c4473a','#fff','#2f6fc0'][(i+Math.floor(townT*6))%3]);R(x-8,rt+5,16,8,'#fff8e6');R(x-6,rt+7,12,1,'#2b1f45');for(let i=0;i<6;i++)R(x-6+i*2,rt+8,1,3,'#2b1f45')}
  if(k==='tattoo'){const c=Math.sin(townT*5)>-0.3?'#ff5fa2':'#8a4a6a';R(x-5,rt+5,4,3,c);R(x+1,rt+5,4,3,c);R(x-6,rt+7,12,3,c);R(x-4,rt+10,8,2,c);R(x-2,rt+12,4,1,c)}
  if(locked){lx.fillStyle='#1b1430a0';lx.fillRect(l-2,rt-2,BW+4,ROOF+WALL+2);
    R(x-4,wt-4,8,6,'#ffd23f');R(x-3,wt-8,1,4,'#ffd23f');R(x+2,wt-8,1,4,'#ffd23f');R(x-3,wt-9,6,1,'#ffd23f');R(x,wt-2,1,2,'#3a2a00')}
}
function drawTown(dt){
  townT+=dt;
  for(let y=0;y<LH;y+=8)for(let x=0;x<LW;x+=8)R(x,y,8,8,((x+y)/8)%2?'#6cc45a':'#66bd55');
  for(let y=3;y<LH;y+=7)for(let x=(y%2)*4;x<LW;x+=11)R(x,y,1,2,'#58ad48');
  streets.forEach(s=>{R(s.x,s.y,s.w,s.h,'#d8c8a0');
    for(let y=s.y;y<s.y+s.h;y+=5)for(let x=s.x+((y-s.y)/5%2)*3;x<s.x+s.w;x+=6)R(x,y,1,1,'#c4b48c')});
  streets.forEach(s=>{R(s.x,s.y,s.w,1,'#b8a87e');R(s.x,s.y+s.h-1,s.w,1,'#b8a87e')});
  if(fountain)drawFountain(fountain);
  // draw buildings, trees and Nailong sorted by their front y so nearer things overlap farther ones
  const dx=me.tx-me.x,dy=me.ty-me.y,d=Math.hypot(dx,dy),sp=70*dt,walking=d>sp;
  if(walking){me.x+=dx/d*sp;me.y+=dy/d*sp}
  else{me.x=me.tx;me.y=me.ty;if(me.goal){const g=me.goal;me.goal=null;enterShop(g)}}
  const items=[...B.map(b=>({y:b.y,f:()=>building(b)})),...deco.map(o=>({y:o.y,f:()=>o.t==='tree'?tree(o.x,o.y):(R(o.x,o.y,1,1,o.c),R(o.x-1,o.y+1,1,1,o.c),R(o.x+1,o.y+1,1,1,o.c),R(o.x,o.y+2,1,1,'#3f9b3a'))})),
    {y:me.y,f:()=>{lx.fillStyle='#0003';lx.beginPath();lx.ellipse(Math.round(me.x),Math.round(me.y),6,2,0,0,7);lx.fill();nailong(Math.round(me.x),Math.round(me.y),0,walking?townT:0)}}];
  items.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
  if(G.phase==='night'){lx.fillStyle='#0b0b3a8c';lx.fillRect(0,0,LW,LH);
    B.forEach(b=>{if(!G.open[b.k])return;const l=b.x-BW/2,wt=b.y-WALL;R(l+5,wt+3,7,5,'#ffe27a');R(l+BW-12,wt+3,7,5,'#ffe27a')})}
}
function townLabels(){
  ctx.save();ctx.textAlign='center';ctx.textBaseline='top';
  const fs=Math.max(11,Math.round(S*4));
  ctx.font=`900 ${fs*DPR}px -apple-system,"PingFang SC",sans-serif`;
  B.forEach(b=>{const t=SHOPS[b.k].name+(G.open[b.k]?'':` · ${SHOPS[b.k].price}金币`);
    const x=b.x*S*DPR,y=(b.y+7)*S*DPR;
    ctx.lineWidth=4*DPR;ctx.strokeStyle='#0e0a18';ctx.strokeText(t,x,y);ctx.fillStyle=G.open[b.k]?'#fff8e6':'#ffd23f';ctx.fillText(t,x,y)});
  ctx.restore();
}
cv.addEventListener('pointerdown',e=>{
  if(scene!=='town'||!$('panel').classList.contains('hidden'))return;
  const x=e.clientX/S,y=e.clientY/S;
  const b=B.find(b=>x>b.x-b.w/2-3&&x<b.x+b.w/2+3&&y>b.y-b.h-8&&y<b.y+8);
  if(b){me.tx=b.x;me.ty=b.y+7;me.goal=b.k}
  else{me.tx=Math.max(4,Math.min(LW-4,x));me.ty=Math.max(Math.ceil(80/S),Math.min(LH-2,y));me.goal=null}
});

// ---------- panels ----------
function show(html){$('card').innerHTML=html;$('panel').classList.remove('hidden')}
function hide(){$('panel').classList.add('hidden')}
function bind(id,fn){const el=$(id);if(el)el.onclick=fn}
function welcome(){
  show(`<h2>奶龙小镇 · 可浏览 demo</h2>
  <p>2078 年，上帝说：<b>苏打饼干一定要有孔。</b>你是针头奶龙，替上帝给小镇打孔。</p>
  <p><b>白天边做边卖</b>：开店前定好售价比，客人排队点单，你现场打孔，每块打完按评分估值、按售价上货架，比估值便宜卖得快、贵了卖得慢；定制单当场做，客人给表情反馈。打烊出账本。</p>
  <p><b>晚上强化</b>：回主角家神台祈祷升级，去饼干店升级店铺，攒钱开<b>植发店</b>、<b>纹身店</b>，然后睡觉。</p>
  <p>俯视角小镇：点建筑奶龙会走过去，点空地闲逛。打孔只靠<b>倾斜手机</b>，左手「固定」，右手「打孔」。电脑上用方向键。</p>
  <div class="row"><button class="px" id="goB">进入小镇（第 ${G.day} 天${G.phase==='night'?'晚上':'白天'}）</button></div>
  <p style="color:#a99cc6;font-size:12px">这是看流程用的原型：画面、数值都是占位，以策划案和 GAMEPLAY.md 为准。</p>`);
  bind('goB',hide);
}
function msg(title,text,btn='好',fn=hide){show(`<h2>${title}</h2><p>${text}</p><div class="row"><button class="px gray" id="xB">${btn}</button></div>`);bind('xB',fn)}
function stars(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function enterShop(k){
  if(k==='home')return homePanel();
  if(!G.open[k]){
    const p=SHOPS[k].price;
    if(G.phase!=='night')return msg(`${SHOPS[k].name}（未开张）`,`${SHOPS[k].desc}。开新店是晚上的事：打烊后带着金币（${p}）再来。`);
    show(`<h2>${SHOPS[k].name}（未开张）</h2><p>${SHOPS[k].desc}。</p><p>正式版里要先打完这家店的一章（约 5 关，最后一关上帝验收）才能开张；demo 里直接花金币开。</p>
      <div class="row"><button class="px" id="buyB" ${G.coins<p?'disabled':''}>花 ${p} 金币开张</button><button class="px gray" id="xB">走了</button></div>`);
    bind('buyB',()=>{G.coins-=p;G.open[k]=1;save();hud();toast(SHOPS[k].name+' 开张！明天白天可以营业');hide()});bind('xB',hide);return;
  }
  if(G.phase==='night'){
    if(k!=='biscuit')return msg(SHOPS[k].name,'晚上打烊了。晚上回<b>主角家</b>祈祷升级，或者在<b>饼干店</b>升级店铺。');
    return shopUpPanel();
  }
  if(G.opened)return msg(SHOPS[k].name,'今天已经营业过了，一天只开一家店。打烊后就是晚上了。');
  if(k==='biscuit')return pricePanel();
  show(`<h2>${SHOPS[k].name} · 白天</h2><p>${SHOPS[k].desc}。今天的客人会当场坐下来让你打孔、当场付钱。</p>
    <div class="row"><button class="px" id="openB">开门营业</button><button class="px gray" id="xB">再想想</button></div>`);
  bind('openB',()=>{G.opened=true;save();startSpot(k)});bind('xB',hide);
}
function upRows(list){return list.map(u=>{const lv=G.up[u.k],c=u.cost[lv];
  return `<div class="up"><div><b>${u.name}</b> Lv${lv}<br>${u.eff}</div>${c==null?'<span>满级</span>':`<button class="px blue" data-u="${u.k}" ${G.coins<c?'disabled':''}>${c} 金币</button>`}</div>`}).join('')}
function bindUps(list,again,lines){document.querySelectorAll('[data-u]').forEach(el=>el.onclick=()=>{
  const u=list.find(u=>u.k===el.dataset.u),c=u.cost[G.up[u.k]];if(G.coins<c)return;
  G.coins-=c;G.up[u.k]++;save();hud();toast(lines[Math.floor(Math.random()*lines.length)],1.6);again()})}
function homePanel(){
  const night=G.phase==='night';
  show(`<h2>主角家 · 十字架神台</h2><p>跪在神台前祈祷，上帝会对针头奶龙动手改造。</p>${upRows(UPS)}
    <p style="color:#a99cc6;font-size:12px">${night?'晚上了：升级完就睡觉。':'白天先去开店，晚上再回来强化也行。'}</p>
    <div class="row"><button class="px gray" id="sleepB">${night?'睡觉，进入第 '+(G.day+1)+' 天':'出门'}</button></div>`);
  bindUps(UPS,homePanel,['✝ 上帝：准了。','✝ 上帝：这个改造不退不换。','✝ 上帝：去打孔吧，孩子。','✝ 上帝：别问，问就是旨意。']);
  bind('sleepB',()=>{if(night)sleep();else hide()});
}
function shopUpPanel(){
  show(`<h2>饼干店 · 晚上升级店铺</h2>${upRows(SHOP_UPS)}<div class="row"><button class="px gray" id="xB">走了</button></div>`);
  bindUps(SHOP_UPS,shopUpPanel,['装修队：搞定！','新东西装好了。']);bind('xB',hide);
}
function sleep(){G.day++;G.phase='day';G.opened=false;G.edict=(G.edict+1+Math.floor(Math.random()*(EDICTS.length-1)))%EDICTS.length;
  D={orders:0,rev:0,angry:0,best:0,tips:0,mat:0};save();hud();hide();toast('第 '+G.day+' 天 · 早上，上帝发来今日旨意',1.6)}

// ---------- day: biscuit shop, punch and sell on the spot ----------
const NAMES=['路过的奶龙','隔壁老奶龙','穿西装的奶龙','健身奶龙','奶龙小学生','神秘收藏家'];
const HOLES=['圆','星','心','方'];
let shop=null,queue=[],day=null;
function who(){return NAMES[Math.floor(Math.random()*NAMES.length)]}
function reaction(r){return r<0.8?['😍','抢着买']:r<1.1?['🙂','正常买走']:r<1.4?['🤔','犹豫了一下还是买了']:['😤','嫌贵']}
function pricePanel(){
  show(`<h2>饼干店 · 开门前定价</h2>
    <p>今天要接 <b>${4+G.up.bell}</b> 单。每块饼干打完按评分估值，售价 = 估值 × 售价比。<b>低于估值卖得快，高于估值卖得慢</b>，营业中也能改。</p>
    <div class="row" style="align-items:center"><button class="px gray" id="rM">−</button><b id="rV" style="font-size:24px;min-width:70px">×${G.ratio.toFixed(1)}</b><button class="px gray" id="rP">＋</button></div>
    <p id="rH" style="text-align:center"></p>
    <div class="row"><button class="px" id="openB">开门营业</button><button class="px gray" id="xB">再想想</button></div>`);
  const upd=()=>{$('rV').textContent='×'+G.ratio.toFixed(1);const [e,t]=reaction(G.ratio);$('rH').textContent=`客人大概会：${e} ${t}`};
  bind('rM',()=>{G.ratio=Math.max(0.5,Math.round((G.ratio-0.1)*10)/10);upd()});bind('rP',()=>{G.ratio=Math.min(2,Math.round((G.ratio+0.1)*10)/10);upd()});upd();
  bind('openB',()=>{G.opened=true;save();startBiscuitDay()});bind('xB',hide);
}
function startBiscuitDay(){
  shop='biscuit';const n=4+G.up.bell;queue=[];
  for(let i=0;i<n;i++)queue.push({mode:'sell',kind:'biscuit',who:who()});
  const ci=1+Math.floor(Math.random()*(n-1));queue[ci]={mode:'custom',kind:'biscuit',who:who(),custom:{hole:HOLES[Math.floor(Math.random()*HOLES.length)]}};
  day={shelf:[],t:0,log:'',final:false};nextJob();
}
function nextJob(){
  if(!queue.length){day.final=true;return shelfPanel()}
  const o=queue[0];
  show(custHead(o,o.mode==='custom'?`定制：全部扎<b>${o.custom.hole}</b>形孔，要 ★★★，我在这儿等着！`:'老板，来块苏打饼干！')+
    `<p>${o.mode==='custom'?'定制单不参与定价：按估值 × 3 结算，客人当场给反馈。':'打完按评分估值，按售价比上货架。'}还剩 ${queue.length} 单。</p>
    <div class="row"><button class="px" id="takeB">现场打孔</button></div>`);
  drawCust($('cust'),0);bind('takeB',()=>startPunch(o));
}
function valueOf(st,acc){return Math.round(SHOPS.biscuit.base*(0.6+0.4*st)*(0.8+0.4*acc)*(1+0.2*G.up.sign))}
function sellResult(o,res){
  queue.shift();D.mat+=5;const t=tierOf(res),st=t>=3?3:t===2?2:t===1?1:0;
  if(o.mode==='custom'){const v=valueOf(Math.max(1,st),res.acc);
    return settle(t,t>=2?v*3:t===1?v:0,`扎中 ${res.hit}/${res.total}，扎歪 ${res.wrong}。定制单：估值 ${v} × 3。`)}
  if(!st){day.log='饼干裂了 💥 这块卖不了';return shelfPanel()}
  const v=valueOf(st,res.acc);day.shelf.push({st,v,prog:0,sold:false});day.log=`上架：${stars(st)} 估值 ${v}，售价 ${Math.round(v*G.ratio)}`;shelfPanel();
}
function shelfPanel(){
  const items=day.shelf.filter(s=>!s.sold);
  show(`<h2>柜台 · ${day.final?'打烊前 <span id="stT">8</span> 秒':'客人正在挑'}</h2>
    <div class="row" style="align-items:center;margin-top:0">售价比 <button class="px gray" id="rM" style="padding:6px 10px">−</button><b id="rV" style="font-size:18px;min-width:50px">×${G.ratio.toFixed(1)}</b><button class="px gray" id="rP" style="padding:6px 10px">＋</button></div>
    <div id="shelf"></div><p id="stLog" style="text-align:center;min-height:22px">${day.log}</p>
    <div class="row">${day.final?'<button class="px gray" id="endB">直接打烊</button>':'<button class="px" id="nextB">打下一块</button>'}</div>`);
  const ch=d=>{G.ratio=Math.min(2,Math.max(0.5,Math.round((G.ratio+d)*10)/10));$('rV').textContent='×'+G.ratio.toFixed(1);shelfUI()};
  bind('rM',()=>ch(-0.1));bind('rP',()=>ch(0.1));
  bind('nextB',()=>{clearInterval(day.h);nextJob()});bind('endB',()=>{clearInterval(day.h);endDay()});
  day.t=0;day.last=performance.now();clearInterval(day.h);day.h=setInterval(shelfTick,100);shelfUI();
}
function shelfUI(){
  const el=$('shelf');if(!el)return;const live=day.shelf.filter(s=>!s.sold);
  el.innerHTML=live.length?live.map(s=>{const p=Math.round(s.v*G.ratio);return `<div class="up"><div style="flex:1"><b>${stars(s.st)}</b> 估值 ${s.v} · 售价 <b>${p}</b>
    <div style="height:6px;background:#0e0a18;margin-top:4px"><div style="height:6px;width:${Math.min(100,s.prog*100)}%;background:#ffd23f"></div></div></div></div>`}).join(''):'<p style="text-align:center;color:#a99cc6">货架空了</p>';
  if($('stLog'))$('stLog').textContent=day.log;if($('stT'))$('stT').textContent=Math.max(0,Math.ceil(8-day.t));
}
function shelfTick(){
  if(!$('shelf')){clearInterval(day.h);return}
  const now=performance.now(),dt=Math.min(0.3,(now-day.last)/1000);day.last=now;day.t+=dt;
  const r=G.ratio,crowd=1+Math.max(0,G.rep)*0.03;
  day.shelf.forEach(s=>{if(s.sold)return;
    s.prog+=dt*crowd*(0.6+Math.random()*0.8)/(3*Math.pow(r,3)); // 占位：售价比越高越慢，公式待定
    if(s.prog>=1){const p=Math.round(s.v*r),[e,t]=reaction(r);s.sold=true;D.orders++;D.rev+=p;G.coins+=p;hud();
      if(r<0.8)D.best=Math.max(D.best,4);day.log=`${who()} ${e} ${t}，付 ${p} 金币`}
    else if(r>=1.4&&Math.random()<dt*0.3)day.log=`${who()} 😤 ${Math.round(s.v*r)} 金币？嫌贵走掉了`});
  shelfUI();
  if(day.final&&(day.t>=8||day.shelf.every(s=>s.sold))){clearInterval(day.h);endDay()}
}
function endDay(){
  const left=day.shelf.filter(s=>!s.sold).length;day.shelf=[];
  msg('打烊',left?`还剩 ${left} 块没卖掉，打烊清掉了（不留到明天）。`:'全卖光了！','看账本',closeShop);
}
function custHead(o,line){return `<h2>${SHOPS[shop].name}</h2>
  <canvas id="cust" width="48" height="40" style="width:144px;height:120px;image-rendering:pixelated"></canvas><br><span class="bubble">${o.who}：${line}</span>`}
function drawCust(c,mood){ // reuse the sprite helper on a small canvas
  const t2=c.getContext('2d');t2.clearRect(0,0,48,40);
  const keep=R;R=(x,y,w,h,col)=>{t2.fillStyle=col;t2.fillRect(Math.round(x),Math.round(y),w,h)};
  t2.fillStyle='#1d1530';t2.fillRect(0,32,48,8);
  nailong(24,34,mood,performance.now()/1000,1.4);R=keep;}
function closeShop(){
  const mat=D.mat,rent=15,prof=D.rev-mat-rent;
  const e=EDICTS[G.edict],ok=e.ok(D),bonus=ok?e.r:0;
  G.coins+=bonus-mat-rent;G.phase='night';save();hud();
  show(`<h2>打烊 · 第 ${G.day} 天账本</h2><table class="ledger">
    <tr><td>营业额（${D.orders} 单）</td><td>+${D.rev}</td></tr><tr><td>其中小费</td><td>${D.tips}</td></tr>
    <tr><td>原料（每块 5）</td><td>−${mat}</td></tr><tr><td>房租水电</td><td>−${rent}</td></tr>
    <tr><td>上帝旨意：${e.t}</td><td>${ok?'+'+bonus+' ✓':'没完成'}</td></tr>
    <tr><td><b>今日利润</b></td><td><b>${prof+bonus}</b></td></tr></table>
    <p>天黑了，现在有 <b>${G.coins}</b> 金币。晚上去强化：主角家神台升级、饼干店升级店铺、开新店，然后睡觉。</p>
    <div class="row"><button class="px" id="homeB">回家</button></div>`);
  bind('homeB',()=>{hide();scene='town';const h=B[0];me.tx=h.x;me.ty=h.y+7;me.goal='home'});
}

// ---------- day: hair / tattoo, punched on the spot ----------
function startSpot(k){
  shop=k;queue=[];
  for(let i=0;i<3;i++)queue.push({mode:'spot',kind:k,who:who(),custom:Math.random()<0.3});
  nextSpot();
}
function nextSpot(){
  if(!queue.length)return closeShop();
  const o=queue[0],line=shop==='hair'?(o.custom?'定制：发际线往前挪 2 厘米，一根都不能歪。':'帮我种点头发，秃得发亮了。'):(o.custom?'定制：纹一颗心，要和上帝的旨意一样圆满。':'随便纹个爱心吧。');
  show(custHead(o,line)+`<p>${o.custom?'<b>定制</b>：做得好付 3 倍价，做砸了可能一分不给。':'按做得好坏付钱。'}</p><div class="row"><button class="px" id="takeB">请坐，开扎</button></div>`);
  drawCust($('cust'),0);bind('takeB',()=>startPunch(o));
}
function spotResult(o,res){
  queue.shift();const t=tierOf(res),b=SHOPS[shop].base;
  const pay=t===0?0:o.custom?(t>=2?b*3:b):Math.round(b*(t===1?0.5:1));
  settle(t,pay,`扎中 ${res.hit}/${res.total}，扎歪 ${res.wrong}，平均准度 ${Math.round(res.acc*100)}%。`);
}

// ---------- feedback (已定表情) ----------
const TIERS=[
  {name:'生气',emo:'😡👎',rep:-3},
  {name:'嘲笑',emo:'🤣👉🏻🤡',rep:-1},
  {name:'还行',emo:'😋👍',rep:0},
  {name:'很好',emo:'✋😇🤚',tip:0.2,rep:1},
  {name:'超赞',emo:'奶龙大笑',tip:0.5,rep:2},
];
function tierOf({missed,wrong,acc}){return missed===0&&wrong===0&&acc>=0.7?4:missed===0&&acc>=0.5?3:missed===0?2:missed<=2?1:0}
function settle(t,pay,line){
  const T=TIERS[t],tip=Math.round(pay*(T.tip||0));
  D.orders++;D.rev+=pay+tip;D.tips+=tip;if(t===0)D.angry++;D.best=Math.max(D.best,t);
  G.coins+=pay+tip;G.rep+=T.rep;save();hud();
  show(`<h2>客人的反馈：${T.name}</h2>
    ${t===4?'<canvas id="cust" width="48" height="40" style="width:192px;height:160px;image-rendering:pixelated"></canvas><div style="font-size:26px;font-weight:900;color:#ffd23f">哈哈哈哈哈！</div>':`<div class="big">${T.emo}</div>`}
    <p>${line}</p>
    <p>${t===0?'客人一分钱没给，口碑 −3。':`收入 ${pay} 金币${tip?`，小费 ${tip}`:''}；口碑 ${T.rep>=0?'+':''}${T.rep}。`}</p>
    <div class="row"><button class="px" id="nB">${queue.length?'下一位':'打烊'}</button></div>`);
  if(t===4){const c=$('cust');const an=()=>{if(!c.isConnected)return;drawCust(c,1);requestAnimationFrame(an)};an()}
  bind('nB',shop==='biscuit'?nextJob:nextSpot);
}

// ---------- gyro ----------
let raw={x:0,y:0},base={x:0,y:0},gotTilt=false,listening=false,askedTilt=false;
function onOri(e){if(e.beta==null||e.gamma==null)return;gotTilt=true;
  const ang=(screen.orientation&&screen.orientation.angle)??window.orientation??0;let x,y;
  if(ang===90){x=e.beta;y=-e.gamma}else if(ang===-90||ang===270){x=-e.beta;y=e.gamma}else{x=e.gamma;y=e.beta}
  raw.x=x;raw.y=y}
async function enableTilt(){try{
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')return false}
  if(!listening){addEventListener('deviceorientation',onOri);listening=true}
  if(!gotTilt)await new Promise(r=>setTimeout(r,700));return gotTilt}catch(e){return false}}
function calibrate(){base={x:raw.x,y:raw.y}}
const TUNE=(()=>{const d={dead:1.5,full:22,curve:1,invX:false,invY:false};try{return Object.assign(d,JSON.parse(localStorage.getItem('sodaTune')||'{}'))}catch(e){return d}})();
function tiltAxis(v,inv){const a=Math.abs(v)-TUNE.dead;if(a<=0)return 0;const k=Math.min(1,a/Math.max(1,TUNE.full-TUNE.dead));return Math.sign(v)*Math.pow(k,TUNE.curve)*(inv?-1:1)}
const keys={};addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);
$('calB').onclick=()=>{calibrate();toast('已校准',0.8)};

// ---------- punching ----------
let P=null;
async function startPunch(o){
  if(!askedTilt){askedTilt=true;await enableTilt()}
  hide();scene='punch';calibrate();
  const kind=o.kind,tg=[];
  if(kind==='biscuit'){for(let r=0;r<2;r++)for(let c=0;c<3;c++)tg.push({x:-24+c*24,y:-9+r*18,r:5})}
  else if(kind==='hair'){for(let r=0;r<2;r++)for(let c=0;c<5;c++)tg.push({x:-24+c*12+(r?6:0),y:-14+r*9,r:3})}
  else{for(let i=0;i<8;i++){const a=i/8*Math.PI*2,x=16*Math.pow(Math.sin(a),3),y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));tg.push({x:x*1.4,y:y*1.4-2,r:3.5})}}
  P={o,kind,tg,holes:[],wrong:0,t:0,limit:(kind==='tattoo'?25:20)+5*G.up.night,n:{x:-40,y:20},v:{x:0,y:0},lock:null,zoom:1,trem:{x:0,y:0},done:false};
  $('gameUI').classList.remove('hidden');
  $('zoomB').classList.toggle('hidden',!G.up.zoom);$('zoomB').innerHTML='放大<br>1×';
  $('tip').textContent=gotTilt?'倾斜手机移动针头，按住「固定」稳住，点「打孔」扎下':'没检测到陀螺仪：电脑上用方向键移动针头（手机请用 https 打开并允许陀螺仪）';
}
function lockDown(e){e.preventDefault();if(P)P.lock={x:P.n.x,y:P.n.y};$('lockB').classList.add('on')}
function lockUp(e){e.preventDefault();if(P)P.lock=null;$('lockB').classList.remove('on')}
$('lockB').addEventListener('pointerdown',lockDown);$('lockB').addEventListener('pointerup',lockUp);$('lockB').addEventListener('pointercancel',lockUp);$('lockB').addEventListener('pointerleave',lockUp);
$('zoomB').onclick=()=>{if(!P)return;const max=1+G.up.zoom;P.zoom=P.zoom>=max?1:P.zoom+1;$('zoomB').innerHTML='放大<br>'+P.zoom+'×'};
$('punchB').addEventListener('pointerdown',e=>{e.preventDefault();punch()});
$('giveupB').onclick=()=>finishPunch();
function onObject(x,y){const k=P.kind;
  if(k==='biscuit')return Math.abs(x)<42&&Math.abs(y)<25;
  if(k==='hair')return (x*x)/(40*40)+(y+4)*(y+4)/(28*28)<1;
  return Math.abs(x)<44&&Math.abs(y+2)<30}
function punch(){
  if(!P||P.done)return;const {x,y}=P.n;
  if(!onObject(x,y)){toast('扎到台子上了',0.6);return}
  let best=null,bd=1e9;P.tg.forEach(t=>{if(t.hit)return;const d=Math.hypot(t.x-x,t.y-y);if(d<bd){bd=d;best=t}});
  const hole={x,y,ok:false};
  if(best&&bd<=best.r+1){best.hit=true;best.acc=Math.max(0,1-bd/(best.r+1));hole.ok=true;toast(best.acc>0.85?'完美正中！':best.acc>0.5?'很准':'擦边',0.5)}
  else{P.wrong++;toast('扎歪了',0.6);if(navigator.vibrate)navigator.vibrate([40,40,40])}
  P.holes.push(hole);
  if(P.tg.every(t=>t.hit))setTimeout(finishPunch,350);
}
function finishPunch(){
  if(!P||P.done)return;P.done=true;
  const hit=P.tg.filter(t=>t.hit),acc=hit.length?hit.reduce((s,t)=>s+t.acc,0)/hit.length:0;
  const res={hit:hit.length,total:P.tg.length,missed:P.tg.length-hit.length,wrong:P.wrong,acc};
  $('gameUI').classList.add('hidden');$('tip').textContent='';$('lockB').classList.remove('on');
  const o=P.o;scene='town';P=null;o.mode==='spot'?spotResult(o,res):sellResult(o,res);
}
function drawPunch(dt){
  P.t+=dt;if(P.t>=P.limit)finishPunch();if(!P)return;
  // move needle
  let ax=tiltAxis(raw.x-base.x,TUNE.invX),ay=tiltAxis(raw.y-base.y,TUNE.invY);
  if(keys.ArrowLeft)ax=-1;if(keys.ArrowRight)ax=1;if(keys.ArrowUp)ay=-1;if(keys.ArrowDown)ay=1;
  const spd=55*(P.zoom===1?1:P.zoom===2?0.8:0.65);
  const k=Math.min(1,dt*8);P.v.x+=(ax*spd-P.v.x)*k;P.v.y+=(ay*spd-P.v.y)*k;
  const tr=2.2*(1-0.35*G.up.wrist)/Math.sqrt(P.zoom);
  P.trem.x+=(Math.random()-0.5)*tr*dt*30;P.trem.y+=(Math.random()-0.5)*tr*dt*30;P.trem.x*=0.92;P.trem.y*=0.92;
  P.n.x+=P.v.x*dt+P.trem.x*dt*6;P.n.y+=P.v.y*dt+P.trem.y*dt*6;
  if(P.lock){const dx=P.n.x-P.lock.x,dy=P.n.y-P.lock.y,d=Math.hypot(dx,dy),m=5;if(d>m){P.n.x=P.lock.x+dx/d*m;P.n.y=P.lock.y+dy/d*m}}
  P.n.x=Math.max(-60,Math.min(60,P.n.x));P.n.y=Math.max(-40,Math.min(40,P.n.y));
  // scene
  const z=P.zoom,cx=LW/2,cy=LH/2,s=Math.max(1,Math.min(LW/120,LH/80))*z;
  const ox=z>1?-P.n.x*s:0,oy=z>1?-P.n.y*s:0;
  const W=(x,y)=>[cx+ox+x*s,cy+oy+y*s];
  const bg={biscuit:['#3a2b52','#46356a'],hair:['#2f4a5e','#385a70'],tattoo:['#2a1f3a','#352848']}[P.kind];
  for(let y=0;y<LH;y+=8)for(let x=0;x<LW;x+=8)R(x,y,8,8,((x+y)/8)%2?bg[0]:bg[1]);
  const box=(x,y,w,h,c)=>{const [a,b]=W(x,y);R(a,b,Math.ceil(w*s),Math.ceil(h*s),c)};
  if(P.kind==='biscuit'){box(-44,-27,88,54,'#b07a3a');box(-42,-25,84,50,'#e8b46a');box(-42,-25,84,3,'#f6cf8a');
    for(let i=0;i<14;i++){const x=-38+((i*37)%76),y=-21+((i*23)%42);box(x,y,1,1,'#fff8e6')}}
  else if(P.kind==='hair'){for(let y=-32;y<=24;y++){const w=40*Math.sqrt(Math.max(0,1-(y+4)*(y+4)/(28*28)));box(-w,y,w*2,1,y<-24?'#f2b8a0':'#f7c9b2')}
    box(-30,8,8,3,'#5a3b22');box(22,8,8,3,'#5a3b22');}
  else{box(-46,-32,92,62,'#d99a74');box(-46,-32,92,3,'#e8b08c');box(-46,27,92,3,'#b87a58')}
  // targets
  P.tg.forEach(t=>{if(t.hit)return;const [a,b]=W(t.x,t.y),r=t.r*s;
    lx.fillStyle='#ffffffcc';for(let i=0;i<16;i+=2){const an=i/16*Math.PI*2+P.t;lx.fillRect(Math.round(a+Math.cos(an)*r),Math.round(b+Math.sin(an)*r),Math.max(1,s/2|0),Math.max(1,s/2|0))}
    if(P.kind==='biscuit'&&P.o.custom){lx.fillStyle='#ffd23f';lx.font=`${Math.max(6,Math.round(r))}px sans-serif`;lx.textAlign='center';lx.textBaseline='middle';lx.fillText(P.o.custom&&P.o.custom.hole||'',a,b)}});
  // holes
  if(P.kind==='tattoo'){const ok=P.holes.filter(h=>h.ok);lx.strokeStyle='#2b1f45';lx.lineWidth=Math.max(1,s*0.8);lx.beginPath();ok.forEach((h,i)=>{const [a,b]=W(h.x,h.y);i?lx.lineTo(a,b):lx.moveTo(a,b)});lx.stroke()}
  P.holes.forEach(h=>{const [a,b]=W(h.x,h.y),r=Math.max(1,Math.round(1.6*s));
    if(P.kind==='hair'&&h.ok){R(a-r/2,b-r/2,r,r,'#5a3b22');R(a-1,b-4*s,Math.max(1,s/2|0),4*s,'#3a2414');R(a+s,b-3*s,Math.max(1,s/2|0),3*s,'#3a2414')}
    else R(a-r/2,b-r/2,r,r,h.ok?(P.kind==='tattoo'?'#2b1f45':'#6a3d12'):'#c4473a')});
  // needle
  const [na,nb]=W(P.n.x,P.n.y),nr=Math.max(3,Math.round(1.6*s));
  if(P.lock){const [la,lb]=W(P.lock.x,P.lock.y);lx.strokeStyle='#7fb0ff88';lx.lineWidth=1;lx.beginPath();lx.arc(la,lb,5*s,0,7);lx.stroke()}
  lx.strokeStyle='#ffd23f';lx.lineWidth=Math.max(1,s/2|0);lx.beginPath();lx.arc(Math.round(na),Math.round(nb),nr,0,7);lx.stroke();
  R(na,nb,1,1,'#fff');
  R(na+nr,nb-nr-14*Math.min(2,s/2),Math.max(2,s),14*Math.min(2,s/2),'#c9d2e0');
}
function punchHud(){
  if(!P)return;ctx.save();const fs=14*DPR;ctx.font=`900 ${fs}px -apple-system,"PingFang SC",sans-serif`;ctx.textBaseline='top';
  const left=Math.ceil(P.limit-P.t),done=P.tg.filter(t=>t.hit).length;
  const t=`${SHOPS[P.kind].name}${P.o.custom?' · 定制单':''}   剩 ${left} 秒   ${done}/${P.tg.length}   扎歪 ${P.wrong}`;
  ctx.lineWidth=4*DPR;ctx.strokeStyle='#0e0a18';ctx.strokeText(t,10*DPR,10*DPR);ctx.fillStyle='#fff8e6';ctx.fillText(t,10*DPR,10*DPR);ctx.restore();
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  lx.clearRect(0,0,LW,LH);
  if(scene==='punch'&&P)drawPunch(dt);else drawTown(dt);
  ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(lc,0,0,LW*S*DPR,LH*S*DPR);
  $('hud').style.display=scene==='punch'?'none':'flex';
  if(scene==='town')townLabels();else punchHud();
  requestAnimationFrame(frame);
}
resize();hud();welcome();requestAnimationFrame(frame);
</script>
