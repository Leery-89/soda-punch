<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>奶龙小镇 demo</title>
<style>
  html,body{margin:0;height:100%;background:#1b1430;color:#fff8e6;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
  #hud{position:fixed;left:8px;right:8px;top:calc(6px + env(safe-area-inset-top));display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;z-index:2}
  .chip{background:#2b1f45;border:3px solid #0e0a18;box-shadow:inset -3px -3px 0 #1d1530,inset 3px 3px 0 #4a3a6e;padding:3px 8px;font-size:13px;font-weight:800}
  .chip b{color:#ffd23f}
  #edict{flex-basis:100%;font-size:12px;color:#ffe9a8}
  .px{background:#ffd23f;color:#3a2a00;border:3px solid #0e0a18;box-shadow:inset -4px -4px 0 #c99a10,inset 4px 4px 0 #fff2b0;padding:9px 16px;font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;white-space:nowrap}
  .px:active{transform:translateY(2px)}
  .px.gray{background:#8d86a3;color:#1b1430;box-shadow:inset -4px -4px 0 #5f5875,inset 4px 4px 0 #c9c3dc}
  .px.blue{background:#5aa9ff;color:#0b2140;box-shadow:inset -4px -4px 0 #2f6fc0,inset 4px 4px 0 #bfe0ff}
  .px[disabled]{opacity:.45}
  .panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0818c0;z-index:5;padding:16px;box-sizing:border-box}
  .card{width:min(100%,440px);max-height:100%;overflow:auto;background:#2b1f45;border:4px solid #0e0a18;box-shadow:inset -5px -5px 0 #1d1530,inset 5px 5px 0 #4a3a6e;padding:16px;text-align:center;line-height:1.55;box-sizing:border-box}
  .card h2{margin:0 0 6px;color:#ffd23f;font-size:20px}
  .card p{margin:6px 0;font-size:14px;color:#e6dcf5;text-align:left}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .up{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1d1530;padding:8px;margin:6px 0;text-align:left;font-size:13px}
  .up b{color:#ffd23f}
  .big{font-size:56px;line-height:1.1;margin:6px 0}
  .ledger{width:100%;font-size:14px;border-collapse:collapse;margin:6px 0}
  .ledger td{padding:3px 4px;border-bottom:2px dashed #4a3a6e}.ledger td:last-child{text-align:right}
  .bubble{display:inline-block;background:#fff8e6;color:#2b1f45;border:3px solid #0e0a18;padding:8px 12px;font-weight:800;font-size:15px;margin:6px 0}
  .pad{position:fixed;border:3px solid #0e0a18;font-weight:900;font-family:inherit;touch-action:none;-webkit-tap-highlight-color:transparent;z-index:3;width:84px;height:84px;font-size:18px}
  #lockB{left:calc(16px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));background:#5aa9ff;color:#0b2140;box-shadow:inset -5px -5px 0 #2f6fc0,inset 5px 5px 0 #bfe0ff}
  #lockB.on{background:#bfe0ff}
  #zoomB{right:calc(112px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));width:64px;height:64px;font-size:14px;background:#4a3a6e;color:#ffd23f;box-shadow:inset -4px -4px 0 #2b1f45,inset 4px 4px 0 #6d5a96}
  #punchB{right:calc(16px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));background:#ffd23f;color:#3a2a00;box-shadow:inset -5px -5px 0 #c99a10,inset 5px 5px 0 #fff2b0}
  #punchB:active,#zoomB:active{transform:translateY(2px)}
  #gameTop{position:fixed;right:8px;top:calc(6px + env(safe-area-inset-top));display:flex;gap:6px;z-index:3}
  #gameTop button{font-size:12px;padding:5px 8px}
  #ratioBox{display:flex;gap:4px;align-items:center}
  #gameUI.counter #gameTop{top:auto;right:auto;left:calc(8px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));flex-wrap:wrap;max-width:46vw}
  #gameUI.counter #punchB{right:calc(92px + env(safe-area-inset-right));width:88px;height:88px}
  #gameUI.counter #lockB{left:auto;right:calc(14px + env(safe-area-inset-right));bottom:calc(64px + env(safe-area-inset-bottom));width:64px;height:64px;font-size:15px}
  #gameUI.counter #zoomB{right:calc(190px + env(safe-area-inset-right))}
  #toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:22px;font-weight:900;color:#ffd23f;text-shadow:3px 3px 0 #0e0a18;pointer-events:none;z-index:6;opacity:0;transition:opacity .2s;white-space:nowrap}
  #tip{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;color:#d9cdf0;text-shadow:2px 2px 0 #0e0a18;pointer-events:none;z-index:2;text-align:center;width:min(70vw,460px)}
  #dlg{position:fixed;inset:0;z-index:7}
  #dlgBox{position:absolute;left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));min-height:26%;background:#fff8e6;color:#2b1f45;border:4px solid #c9b400;box-shadow:0 0 0 3px #0e0a18;padding:30px 18px 14px;box-sizing:border-box}
  #dlgName{position:absolute;left:10px;top:-20px;background:#fff8e6;border:3px solid #0e0a18;border-radius:20px;padding:4px 22px;font-weight:900;font-size:18px}
  #dlgText{margin:0;font-size:18px;line-height:1.6;font-weight:700}
  #dlgMore{position:absolute;right:12px;bottom:6px;font-size:12px;color:#8a7a6a}
  #pL,#pR{position:absolute;bottom:calc(10px + 26% - 8px);width:min(22vw,180px);image-rendering:pixelated}
  #pL{left:calc(16px + env(safe-area-inset-left))}#pR{right:calc(16px + env(safe-area-inset-right))}
  #rot{position:fixed;inset:0;z-index:20;background:#1b1430;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:18px;font-weight:900;color:#ffd23f;text-align:center}
  #rot div{font-size:64px;animation:spin 1.6s ease-in-out infinite}
  @keyframes spin{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
  #views{font-size:12px;color:#a99cc6;text-align:center!important}#views a{color:#ffd23f;margin:0 4px}
  .hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span class="chip" style="display:flex;align-items:center;gap:5px"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#fff8e6" stroke="#0e0a18" stroke-width="2.5"/><line id="clkH" x1="10" y1="10" x2="10" y2="6" stroke="#0e0a18" stroke-width="2.2" stroke-linecap="round"/><line id="clkM" x1="10" y1="10" x2="10" y2="4" stroke="#0e0a18" stroke-width="1.6" stroke-linecap="round"/></svg><b id="hTime">08:00</b> 第 <b id="hDay">1</b> 天</span>
  <span class="chip">金币 <b id="hCoin">0</b></span>
  <span class="chip">口碑 <b id="hRep">0</b></span>
  <span class="chip" id="edict"></span>
</div>
<div id="tip"></div>
<div id="rot"><div>📱</div>这一版是横屏的，请把手机横过来</div>
<div id="toast"></div>
<div id="dlg" class="hidden"><canvas id="pL" width="48" height="34"></canvas><canvas id="pR" width="48" height="34"></canvas><div id="dlgBox"><span id="dlgName"></span><p id="dlgText"></p><span id="dlgMore">▼ 点一下继续</span></div></div>

<div id="gameUI" class="hidden">
  <div id="gameTop"><span id="ratioBox" class="hidden"><button class="px gray" id="rDn">−</button><b id="rVal" class="chip"></b><button class="px gray" id="rUp">＋</button></span><button class="px gray" id="calB">重新校准</button><button class="px gray" id="tuneB">陀螺仪设置</button><button class="px gray" id="giveupB">交货</button></div>
  <button id="lockB" class="pad">固定</button>
  <button id="zoomB" class="pad hidden">放大<br>1×</button>
  <button id="punchB" class="pad">打孔</button>
</div>

<div class="panel" id="panel"><div class="card" id="card"></div></div>

<script src="../tune.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const lc=document.createElement('canvas'),lx=lc.getContext('2d');
let S=3,LW=200,LH=120,DPR=1;
// 三个对比版本：默认俯视（横竖屏都行）· ?view=h 俯视只横屏 · ?view=side 横版侧视
const VIEW=new URLSearchParams(location.search).get('view')||'top';
let CAM=0,GY=100,WORLD=400;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;
  S=Math.max(2,Math.floor(Math.min(innerWidth,innerHeight)/120));
  LW=Math.ceil(innerWidth/S);LH=Math.ceil(innerHeight/S);
  lc.width=LW;lc.height=LH;
  $('rot').style.display=VIEW!=='top'&&innerHeight>innerWidth?'flex':'none';
  VIEW==='side'?layoutSide():layoutTown();
}
addEventListener('resize',resize);

// ---------- save ----------
const SHOPS={
  home:{name:'主角家',desc:'十字架神台：祈祷让上帝改造升级'},
  biscuit:{name:'饼干店',desc:'给苏打饼干打孔，接定制单',base:20},
  hair:{name:'植发店',desc:'在头皮上打又小又密的孔',base:35,price:150},
  tattoo:{name:'纹身店',desc:'沿图案一针一针扎出纹身',base:50,price:250},
};
const UPS=[
  {k:'wrist',name:'钢铁手腕',eff:'手抖 −35%',cost:[80,180]},
  {k:'zoom',name:'高倍放大镜',eff:'解锁放大键：放大后针头变慢、看得更清',cost:[120,300]},
  {k:'night',name:'夜猫子基因',eff:'每块打孔时间 +5 秒',cost:[60,140]},
];
const SHOP_UPS=[
  {k:'sign',name:'招牌',eff:'估值 +20%',cost:[100,220,450]},
  {k:'bell',name:'门铃',eff:'每天多来 1 单',cost:[80,200]},
];
const EDICTS=[
  {t:'今天让一位客人超满意（超赞或抢着买）',r:30,ok:d=>d.best>=4},
  {t:'今天不许有客人生气',r:20,ok:d=>d.orders>0&&d.angry===0},
  {t:'今天卖出 3 单',r:15,ok:d=>d.orders>=3},
  {t:'今天赚到 80 金币',r:25,ok:d=>d.rev>=80},
];
const DEF={day:1,coins:50,rep:0,open:{home:1,biscuit:1,hair:0,tattoo:0},up:{wrist:0,zoom:0,night:0,sign:0,bell:0},edict:0,sess:0,clock:480,phase:'day',ratio:1};
let G=(()=>{try{const s=JSON.parse(localStorage.getItem('nailongTown6')||'null');if(s)return Object.assign({},DEF,s)}catch(e){}return JSON.parse(JSON.stringify(DEF))})();
let D={orders:0,rev:0,angry:0,best:0,tips:0,mat:0};
function save(){try{localStorage.setItem('nailongTown6',JSON.stringify(G))}catch(e){}}
function fmtClock(m){m=Math.round(m);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function setClock(m){G.clock=m;const h=(m/60)%12,mi=m%60;
  const hand=(id,a,l)=>{const e=$(id);e.setAttribute('x2',10+Math.sin(a)*l);e.setAttribute('y2',10-Math.cos(a)*l)};
  hand('clkH',h/12*Math.PI*2,4.5);hand('clkM',mi/60*Math.PI*2,6.5);$('hTime').textContent=fmtClock(m)}
function hud(){setClock(G.clock);$('hDay').textContent=G.day;$('hCoin').textContent=G.coins;$('hRep').textContent=G.rep;
  const e=EDICTS[G.edict];$('edict').textContent=G.phase==='night'?'🌙 晚上店都关门了：点镇上的奶龙聊天，或者回主角家（桌上升级、解锁店铺，床上睡觉）':'✝ 上帝今日旨意：'+e.t+'（+'+e.r+' 金币）　今天还能营业 '+(2-G.sess)+' 次'}
function toast(t,s=1.2){const el=$('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.opacity=0,s*1000)}

// ---------- pixel helpers ----------
function R(x,y,w,h,c){lx.fillStyle=c;lx.fillRect(Math.round(x),Math.round(y),w,h)}
function nailong(x,y,mood=0,t=0,scale=1,needle=true){ // x,y = feet center
  const s=scale,b=t?Math.round(Math.sin(t*12)*0.6):0;
  const P=(px,py,w,h,c)=>R(x+px*s,y+(py+b)*s,w*s,h*s,c);
  P(-6,-12,12,11,'#ffd23f');P(-7,-10,1,8,'#ffd23f');P(6,-10,1,8,'#ffd23f');P(-5,-13,10,1,'#ffd23f');
  P(-6,-2,12,1,'#e0a800');P(-4,-1,3,1,'#e0a800');P(1,-1,3,1,'#e0a800');
  P(-3,-9,8,6,'#fff2c0');
  // needle on head
  if(needle){P(0,-19,1,6,'#c9d2e0');P(-1,-15,3,2,'#7fb0ff');P(0,-20,1,1,'#ffffff')}
  if(mood===1){P(-4,-10,2,1,'#2b1f45');P(2,-10,2,1,'#2b1f45');P(-2,-6,4,2,'#c4473a');P(-1,-6,2,1,'#ff8a8a')}
  else{P(-4,-10,2,2,'#2b1f45');P(2,-10,2,2,'#2b1f45');P(-1,-6,2,1,'#2b1f45');P(-6,-7,2,1,'#ff9aa8');P(4,-7,2,1,'#ff9aa8')}
}

// ---------- town (top-down, layout from the producer's sketch) ----------
let B=[],streets=[],deco=[],npcs=[],me={x:30,y:80,tx:30,ty:80,goal:null},townT=0,scene='town',MAP=null;
// sketch coordinates (1400 × 800): buildings and the little paths between them
const SK_B={home:[158,67,315,206],biscuit:[888,67,315,206],hair:[259,457,315,206],tattoo:[962,457,316,206]};
const SK_P=[[[473,226],[888,226]],[[316,273],[316,385],[337,385],[337,457]],[[1057,273],[1057,457]],[[574,600],[962,600]]];
function rnd(seed){let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647}
function layoutTown(){
  const top=Math.ceil(80/S),H=LH-top,land=VIEW==='h'||LW>=LH;
  const MW=land?1400:800,MH=land?800:1400,k=Math.min(LW/MW,H/MH);
  const ox=Math.round((LW-MW*k)/2),oy=top+Math.round((H-MH*k)/2);
  const T=(x,y)=>land?[ox+x*k,oy+y*k]:[ox+y*k,oy+x*k];
  MAP={x:ox,y:oy,w:MW*k,h:MH*k};
  HL=null;
  B=Object.entries(SK_B).map(([key,[x,y,w,h]])=>{const [a,b]=T(x,y),[c,d]=T(x+w,y+h);
    const bx=Math.min(a,c),by=Math.min(b,d),bw=Math.abs(c-a),bh=Math.abs(d-b);
    return{k:key,x:Math.round(bx+bw/2),y:Math.round(by+bh),w:Math.round(bw),h:Math.round(bh)}});
  const PW=Math.max(7,Math.round(26*k));streets=[];
  SK_P.forEach(pts=>{for(let i=1;i<pts.length;i++){const [a,b]=T(...pts[i-1]),[c,d]=T(...pts[i]);
    streets.push({x:Math.round(Math.min(a,c)-PW/2),y:Math.round(Math.min(b,d)-PW/2),w:Math.round(Math.abs(c-a)+PW),h:Math.round(Math.abs(d-b)+PW)})}});
  const rand=rnd(7),inB=(x,y,m)=>B.some(b=>x>b.x-b.w/2-m&&x<b.x+b.w/2+m&&y>b.y-b.h-m-4&&y<b.y+m+6),
    onS=(x,y,m)=>streets.some(s=>x>s.x-m&&x<s.x+s.w+m&&y>s.y-m&&y<s.y+s.h+m),
    free=(x,y,m)=>y>top+4&&!inB(x,y,m)&&!onS(x,y,m);
  deco=[];
  // trees ring the town, flowers anywhere on the grass
  for(let i=0;i<600&&deco.filter(d=>d.t==='tree').length<Math.round(LW*LH/1500);i++){const x=rand()*LW,y=rand()*LH;
    const inside=x>MAP.x+MAP.w*0.08&&x<MAP.x+MAP.w*0.92&&y>MAP.y+MAP.h*0.08&&y<MAP.y+MAP.h*0.92;
    if(!inside&&free(x,y,7)&&free(x,y-12,7)&&!deco.some(d=>d.t==='tree'&&Math.hypot(d.x-x,d.y-y)<14))deco.push({t:'tree',x:Math.round(x),y:Math.round(y)})}
  for(let i=0;i<300&&deco.length<Math.round(LW*LH/450);i++){const x=rand()*LW,y=rand()*LH;
    if(free(x,y,2)&&!deco.some(d=>Math.hypot(d.x-x,d.y-y)<6))deco.push({t:'flower',x:Math.round(x),y:Math.round(y),c:['#ff7fa8','#fff4a8','#ffffff','#b48cff'][Math.floor(rand()*4)]})}
  deco.sort((a,b)=>a.y-b.y);
  // townsfolk wandering around, as in the sketch
  const spot=()=>{for(let i=0;i<80;i++){const x=MAP.x+8+Math.random()*(MAP.w-16),y=MAP.y+16+Math.random()*(MAP.h-20);if(!inB(x,y,4))return{x,y}}return{x:MAP.x+MAP.w/2,y:MAP.y+MAP.h/2}};
  npcs=[];for(let i=0;i<9;i++){const p=spot(),q=spot();npcs.push({x:p.x,y:p.y,tx:q.x,ty:q.y,wait:Math.random()*3,spot})}
  if(!me.goal){const h=B[0];me.x=me.tx=h.x;me.y=me.ty=h.y+5}
}
function tree(x,y){
  lx.fillStyle='#0003';lx.beginPath();lx.ellipse(x+2,y+3,7,3,0,0,7);lx.fill();
  R(x-1,y-2,3,5,'#7a4a1a');
  const rows=[[-4,8],[-6,12],[-7,14],[-7,14],[-7,14],[-6,12],[-4,8]];
  rows.forEach(([o,w],i)=>R(x+o,y-12+i*1.4,w,2,i<2?'#5cc252':'#3f9b3a'));
  R(x-3,y-11,3,2,'#7fdc6e');R(x+2,y-7,2,1,'#2f7d2c');
}
function building(b){
  const {k,x,y,w,h}=b,l=Math.round(x-w/2),wall=Math.max(9,Math.round(h*0.36)),roof=h-wall,wt=y-wall,rt=wt-roof,locked=!G.open[k];
  const pal={home:['#f2e3c6','#c4473a','#a03328'],biscuit:['#ffe3b0','#ffd23f','#ffffff'],hair:['#e6f2ff','#5aa9ff','#3f86d6'],tattoo:['#6a5590','#7a4fa8','#64408c']}[k];
  R(l+3,rt+4,w,h,'#0003');
  R(l,wt,w,wall,pal[0]);R(l,y-1,w,1,'#0002');
  const dh=Math.min(wall-1,9);R(x-3,y-dh,6,dh,'#5a3b22');R(x+1,y-Math.round(dh/2),1,1,'#ffd23f');
  const ww=Math.max(5,Math.round(w*0.16)),wh=Math.max(3,Math.round(wall*0.45)),wy=wt+Math.round((wall-wh)/2)-1;
  R(l+Math.round(w*0.12),wy,ww,wh,'#9fd8ff');R(l+w-Math.round(w*0.12)-ww,wy,ww,wh,'#9fd8ff');
  b.win=[[l+Math.round(w*0.12),wy,ww,wh],[l+w-Math.round(w*0.12)-ww,wy,ww,wh]];
  if(k==='biscuit'){for(let i=0;i<w+4;i+=4)R(l-2+i,rt,2,roof+1,pal[1]),R(l+i,rt,2,roof+1,pal[2]);R(l-2,wt-1,w+4,2,'#e0a800')}
  else{for(let i=0;i<roof;i+=3)R(l-2,rt+i,w+4,Math.min(3,roof-i),i%6?pal[1]:pal[2]);R(l-2,rt+Math.round(roof/2),w+4,1,'#0002');R(l-2,wt-1,w+4,2,pal[2])}
  R(l-2,rt,w+4,1,'#fff5');
  const cy=rt+Math.round(roof/2);
  if(k==='home'){R(l+w-10,rt-3,5,7,'#8a7a6a');R(l+w-10,rt-3,5,1,'#5a4a3a');
    R(x-1,cy-8,3,14,'#ffd23f');R(x-4,cy-4,9,3,'#ffd23f');R(x,cy-8,1,14,'#fff2b0')}
  if(k==='biscuit'){R(x-9,wt-7,18,7,'#e8b46a');R(x-9,wt-7,18,1,'#f6cf8a');for(let i=0;i<4;i++)R(x-6+i*4,wt-5,1,1,'#7a4a1a'),R(x-6+i*4,wt-3,1,1,'#7a4a1a')}

function nextSpot(){
  if(!queue.length){G.clock=SESS_START[G.sess]+240;return endSession()}
  const o=queue[0],line=shop==='hair'?(o.custom?'定制：发际线往前挪 2 厘米，一根都不能歪。':'帮我种点头发，秃得发亮了。'):(o.custom?'定制：纹一颗心，要和上帝的旨意一样圆满。':'随便纹个爱心吧。');
  show(custHead(o,line)+`<p>${o.custom?'<b>定制</b>：做得好付 3 倍价，做砸了可能一分不给。':'按做得好坏付钱。'}</p><div class="row"><button class="px" id="takeB">请坐，开扎</button></div>`);
  drawCust($('cust'),0);bind('takeB',()=>startPunch(o));
}
function spotResult(o,res){
  queue.shift();const t=tierOf(res),b=SHOPS[shop].base;
  const pay=t===0?0:o.custom?(t>=2?b*3:b):Math.round(b*(t===1?0.5:1));
  settle(t,pay,`扎中 ${res.hit}/${res.total}，扎歪 ${res.wrong}，平均准度 ${Math.round(res.acc*100)}%。`);
}

// ---------- feedback (已定表情) ----------
const TIERS=[
  {name:'生气',emo:'😡👎',rep:-3},
  {name:'嘲笑',emo:'🤣👉🏻🤡',rep:-1},
  {name:'还行',emo:'😋👍',rep:0},
  {name:'很好',emo:'✋😇🤚',tip:0.2,rep:1},
  {name:'超赞',emo:'奶龙大笑',tip:0.5,rep:2},
];
function tierOf({missed,wrong,acc}){return missed===0&&wrong===0&&acc>=0.7?4:missed===0&&acc>=0.5?3:missed===0?2:missed<=2?1:0}
function settle(t,pay,line){
  const T=TIERS[t],tip=Math.round(pay*(T.tip||0));
  D.orders++;D.rev+=pay+tip;D.tips+=tip;if(t===0)D.angry++;D.best=Math.max(D.best,t);
  G.coins+=pay+tip;G.rep+=T.rep;save();hud();
  show(`<h2>客人的反馈：${T.name}</h2>
    ${t===4?'<canvas id="cust" width="48" height="40" style="width:192px;height:160px;image-rendering:pixelated"></canvas><div style="font-size:26px;font-weight:900;color:#ffd23f">哈哈哈哈哈！</div>':`<div class="big">${T.emo}</div>`}
    <p>${line}</p>
    <p>${t===0?'客人一分钱没给，口碑 −3。':`收入 ${pay} 金币${tip?`，小费 ${tip}`:''}；口碑 ${T.rep>=0?'+':''}${T.rep}。`}</p>
    <div class="row"><button class="px" id="nB">${queue.length?'下一位':'打烊'}</button></div>`);
  if(t===4){const c=$('cust');const an=()=>{if(!c.isConnected)return;drawCust(c,1);requestAnimationFrame(an)};an()}
  bind('nB',nextSpot);
}

// ---------- gyro ----------
let raw={x:0,y:0},base={x:0,y:0},gotTilt=false,listening=false,askedTilt=false;
function onOri(e){if(e.beta==null||e.gamma==null)return;gotTilt=true;
  const ang=(screen.orientation&&screen.orientation.angle)??window.orientation??0;let x,y;
  if(ang===90){x=e.beta;y=-e.gamma}else if(ang===-90||ang===270){x=-e.beta;y=e.gamma}else{x=e.gamma;y=e.beta}
  raw.x=x;raw.y=y}
async function enableTilt(){try{
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')return false}
  if(!listening){addEventListener('deviceorientation',onOri);listening=true}
  if(!gotTilt)await new Promise(r=>setTimeout(r,700));return gotTilt}catch(e){return false}}
function calibrate(){base={x:raw.x,y:raw.y}}
// shared 陀螺仪设置 panel (../tune.js); speed/follow/tremor apply relative to the main game's defaults
const TUNE=SodaTune.TUNE,tiltAxis=SodaTune.tiltAxis;
const keys={};addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);
$('calB').onclick=()=>{calibrate();toast('已校准',0.8)};
SodaTune.attach({tilt:()=>({x:raw.x-base.x,y:raw.y-base.y}),calibrate:()=>{calibrate();toast('已校准',0.8)}});
$('tuneB').onclick=()=>SodaTune.isOpen()?SodaTune.close():SodaTune.open();

// ---------- punching ----------
let P=null;
async function startPunch(o){
  if(!askedTilt){askedTilt=true;await enableTilt()}
  hide();scene='punch';calibrate();
  const kind=o.kind,tg=[];
  if(kind==='biscuit'){for(let r=0;r<2;r++)for(let c=0;c<3;c++)tg.push({x:-24+c*24,y:-9+r*18,r:5})}
  else if(kind==='hair'){for(let r=0;r<2;r++)for(let c=0;c<5;c++)tg.push({x:-24+c*12+(r?6:0),y:-14+r*9,r:3})}
  else{for(let i=0;i<8;i++){const a=i/8*Math.PI*2,x=16*Math.pow(Math.sin(a),3),y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));tg.push({x:x*1.4,y:y*1.4-2,r:3.5})}}
  P={o,kind,tg,holes:[],wrong:0,t:0,limit:(kind==='tattoo'?25:20)+5*G.up.night,n:{x:-40,y:20},v:{x:0,y:0},lock:null,zoom:1,trem:{x:0,y:0},done:false};
  $('gameUI').classList.remove('hidden');
  $('zoomB').classList.toggle('hidden',!G.up.zoom);$('zoomB').innerHTML='放大<br>1×';
  $('tip').textContent=gotTilt?'倾斜手机移动针头，按住「固定」稳住，点「打孔」扎下':'没检测到陀螺仪：电脑上用方向键移动针头（手机请用 https 打开并允许陀螺仪）';
}
function lockDown(e){e.preventDefault();if(P)P.lock={x:P.n.x,y:P.n.y};$('lockB').classList.add('on')}
function lockUp(e){e.preventDefault();if(P)P.lock=null;$('lockB').classList.remove('on')}
$('lockB').addEventListener('pointerdown',lockDown);$('lockB').addEventListener('pointerup',lockUp);$('lockB').addEventListener('pointercancel',lockUp);$('lockB').addEventListener('pointerleave',lockUp);
$('zoomB').onclick=()=>{if(!P)return;const max=1+G.up.zoom;P.zoom=P.zoom>=max?1:P.zoom+1;$('zoomB').innerHTML='放大<br>'+P.zoom+'×'};
$('punchB').addEventListener('pointerdown',e=>{e.preventDefault();punch()});
$('giveupB').onclick=()=>finishPunch();
$('dlg').addEventListener('pointerdown',e=>{e.preventDefault();dlgNext()});
$('rDn').onclick=()=>setRatio(-0.1);$('rUp').onclick=()=>setRatio(0.1);
function onObject(x,y){const k=P.kind;
  if(k==='biscuit')return Math.abs(x)<42&&Math.abs(y)<25;
  if(k==='hair')return (x*x)/(40*40)+(y+4)*(y+4)/(28*28)<1;
  return Math.abs(x)<44&&Math.abs(y+2)<30}
function punch(){
  if(!P||P.done)return;const {x,y}=P.n;
  if(!onObject(x,y)){toast('扎到台子上了',0.6);return}
  let best=null,bd=1e9;P.tg.forEach(t=>{if(t.hit)return;const d=Math.hypot(t.x-x,t.y-y);if(d<bd){bd=d;best=t}});
  const hole={x,y,ok:false};
  if(best&&bd<=best.r+1){best.hit=true;best.acc=Math.max(0,1-bd/(best.r+1));hole.ok=true;toast(best.acc>0.85?'完美正中！':best.acc>0.5?'很准':'擦边',0.5)}
  else{P.wrong++;toast('扎歪了',0.6);if(navigator.vibrate)navigator.vibrate([40,40,40])}
  P.holes.push(hole);
  if(P.tg.every(t=>t.hit))setTimeout(finishPunch,350);
}
function finishPunch(){
  if(!P||P.done)return;P.done=true;
  const hit=P.tg.filter(t=>t.hit),acc=hit.length?hit.reduce((s,t)=>s+t.acc,0)/hit.length:0;
  const res={hit:hit.length,total:P.tg.length,missed:P.tg.length-hit.length,wrong:P.wrong,acc};
  if(P.counter)return deliver(res);
  $('gameUI').classList.add('hidden');$('tip').textContent='';$('lockB').classList.remove('on');
  const o=P.o;scene='town';P=null;spotResult(o,res);
}
function drawPunch(dt){
  if(P.counter){counterTick(dt);if(!P)return}else{P.t+=dt;if(P.t>=P.limit)finishPunch();if(!P)return}
  // move needle
  let ax=tiltAxis(raw.x-base.x,TUNE.invX),ay=tiltAxis(raw.y-base.y,TUNE.invY);
  if(keys.ArrowLeft)ax=-1;if(keys.ArrowRight)ax=1;if(keys.ArrowUp)ay=-1;if(keys.ArrowDown)ay=1;
  const spd=55*TUNE.speed/SodaTune.DEF.speed*(P.zoom===1?1:P.zoom===2?0.8:0.65);
  const k=Math.min(1,dt*TUNE.follow);P.v.x+=(ax*spd-P.v.x)*k;P.v.y+=(ay*spd-P.v.y)*k;
  const tr=2.2*TUNE.tremor*(1-0.35*G.up.wrist)/Math.sqrt(P.zoom);
  P.trem.x+=(Math.random()-0.5)*tr*dt*30;P.trem.y+=(Math.random()-0.5)*tr*dt*30;P.trem.x*=0.92;P.trem.y*=0.92;
  P.n.x+=P.v.x*dt+P.trem.x*dt*6;P.n.y+=P.v.y*dt+P.trem.y*dt*6;
  if(P.lock){const dx=P.n.x-P.lock.x,dy=P.n.y-P.lock.y,d=Math.hypot(dx,dy),m=5;if(d>m){P.n.x=P.lock.x+dx/d*m;P.n.y=P.lock.y+dy/d*m}}
  P.n.x=Math.max(-60,Math.min(60,P.n.x));P.n.y=Math.max(-40,Math.min(40,P.n.y));
  // scene
  const z=P.zoom,band=P.counter?Math.round(LH*0.32)+5:0,cx=P.counter?Math.round(LW*0.42):LW/2,cy=P.counter?band+(LH-band)/2:LH/2,
    s=(P.counter?Math.max(0.8,Math.min(LW*0.6/96,(LH-band-6)/58)):Math.max(1,Math.min(LW/120,LH/80)))*z;
  const ox=z>1?-P.n.x*s:0,oy=z>1?-P.n.y*s:0;
  const W=(x,y)=>[cx+ox+x*s,cy+oy+y*s];
  const bg={biscuit:['#3a2b52','#46356a'],hair:['#2f4a5e','#385a70'],tattoo:['#2a1f3a','#352848']}[P.kind];
  for(let y=0;y<LH;y+=8)for(let x=0;x<LW;x+=8)R(x,y,8,8,((x+y)/8)%2?bg[0]:bg[1]);
  const box=(x,y,w,h,c)=>{const [a,b]=W(x,y);R(a,b,Math.ceil(w*s),Math.ceil(h*s),c)};
  if(P.kind==='biscuit'){box(-44,-27,88,54,'#b07a3a');box(-42,-25,84,50,'#e8b46a');box(-42,-25,84,3,'#f6cf8a');
    for(let i=0;i<14;i++){const x=-38+((i*37)%76),y=-21+((i*23)%42);box(x,y,1,1,'#fff8e6')}}
  else if(P.kind==='hair'){for(let y=-32;y<=24;y++){const w=40*Math.sqrt(Math.max(0,1-(y+4)*(y+4)/(28*28)));box(-w,y,w*2,1,y<-24?'#f2b8a0':'#f7c9b2')}
    box(-30,8,8,3,'#5a3b22');box(22,8,8,3,'#5a3b22');}
  else{box(-46,-32,92,62,'#d99a74');box(-46,-32,92,3,'#e8b08c');box(-46,27,92,3,'#b87a58')}
  // targets
  P.tg.forEach(t=>{if(t.hit)return;const [a,b]=W(t.x,t.y),r=t.r*s;
    lx.fillStyle='#ffffffcc';for(let i=0;i<16;i+=2){const an=i/16*Math.PI*2+P.t;lx.fillRect(Math.round(a+Math.cos(an)*r),Math.round(b+Math.sin(an)*r),Math.max(1,s/2|0),Math.max(1,s/2|0))}
    if(P.kind==='biscuit'&&P.o.custom){lx.fillStyle='#ffd23f';lx.font=`${Math.max(6,Math.round(r))}px sans-serif`;lx.textAlign='center';lx.textBaseline='middle';lx.fillText(P.o.custom&&P.o.custom.hole||'',a,b)}});
  // holes
  if(P.kind==='tattoo'){const ok=P.holes.filter(h=>h.ok);lx.strokeStyle='#2b1f45';lx.lineWidth=Math.max(1,s*0.8);lx.beginPath();ok.forEach((h,i)=>{const [a,b]=W(h.x,h.y);i?lx.lineTo(a,b):lx.moveTo(a,b)});lx.stroke()}
  P.holes.forEach(h=>{const [a,b]=W(h.x,h.y),r=Math.max(1,Math.round(1.6*s));
    if(P.kind==='hair'&&h.ok){R(a-r/2,b-r/2,r,r,'#5a3b22');R(a-1,b-4*s,Math.max(1,s/2|0),4*s,'#3a2414');R(a+s,b-3*s,Math.max(1,s/2|0),3*s,'#3a2414')}
    else R(a-r/2,b-r/2,r,r,h.ok?(P.kind==='tattoo'?'#2b1f45':'#6a3d12'):'#c4473a')});
  // needle
  const [na,nb]=W(P.n.x,P.n.y),nr=Math.max(3,Math.round(1.6*s));
  if(P.lock){const [la,lb]=W(P.lock.x,P.lock.y);lx.strokeStyle='#7fb0ff88';lx.lineWidth=1;lx.beginPath();lx.arc(la,lb,5*s,0,7);lx.stroke()}
  lx.strokeStyle='#ffd23f';lx.lineWidth=Math.max(1,s/2|0);lx.beginPath();lx.arc(Math.round(na),Math.round(nb),nr,0,7);lx.stroke();
  R(na,nb,1,1,'#fff');
  R(na+nr,nb-nr-14*Math.min(2,s/2),Math.max(2,s),14*Math.min(2,s/2),'#c9d2e0');
  if(P.counter)drawCounterBand();
}
function punchHud(){
  if(!P)return;if(P.counter)return counterHud();ctx.save();const fs=14*DPR;ctx.font=`900 ${fs}px -apple-system,"PingFang SC",sans-serif`;ctx.textBaseline='top';
  const left=Math.ceil(P.limit-P.t),done=P.tg.filter(t=>t.hit).length;
  const t=`${SHOPS[P.kind].name}${P.o.custom?' · 定制单':''}   剩 ${left} 秒   ${done}/${P.tg.length}   扎歪 ${P.wrong}`;
  ctx.lineWidth=4*DPR;ctx.strokeStyle='#0e0a18';ctx.strokeText(t,10*DPR,10*DPR);ctx.fillStyle='#fff8e6';ctx.fillText(t,10*DPR,10*DPR);ctx.restore();
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  lx.clearRect(0,0,LW,LH);
  if(scene==='punch'&&P)drawPunch(dt);else if(scene==='home')drawHome(dt);else VIEW==='side'?drawSide(dt):drawTown(dt);
  ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(lc,0,0,LW*S*DPR,LH*S*DPR);
  $('hud').style.display=scene==='punch'?'none':'flex';
  if(scene==='town')townLabels();else if(scene==='home')homeLabels();else punchHud();
  requestAnimationFrame(frame);
}
resize();hud();welcome();requestAnimationFrame(frame);
</script>
