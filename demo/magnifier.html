<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>放大镜单孔 demo</title>
<style>
  html,body{margin:0;height:100%;background:#0d1626;color:#eef3ff;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;left:10px;top:calc(8px + env(safe-area-inset-top));font-size:13px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud b{color:#ffd23f}
  #tip{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:13px;color:#b9c6e0;pointer-events:none;text-align:center;width:min(92vw,520px)}
  #punch{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;
    border:4px solid #fff3;background:#ffd23f;color:#3a2a00;font-size:20px;font-weight:800;box-shadow:0 6px 0 #a8820f}
  #punch:active{transform:translateY(4px);box-shadow:0 2px 0 #a8820f}
  #punch.off{background:#56607a;color:#c9d1e4;box-shadow:0 6px 0 #343b4d}
  .btn{background:#ffd23f;color:#3a2a00;border:0;border-radius:12px;padding:12px 22px;font-size:17px;font-weight:700}
  .ghost{background:#ffffff14;color:#eef3ff;border:1px solid #ffffff30;border-radius:10px;padding:6px 10px;font-size:13px}
  #topR{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:6px}
  .panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d1626e8;z-index:5}
  .card{width:min(88vw,420px);background:#18243a;border:1px solid #ffffff22;border-radius:16px;padding:20px;text-align:center;line-height:1.6}
  .card h2{margin:0 0 8px;color:#ffd23f}
  .card p{margin:6px 0;font-size:14px;color:#cdd7ea;text-align:left}
  .big{font-size:40px;font-weight:800;color:#ffd23f;margin:6px 0}
  .hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="topR"><button class="ghost" id="invX">左右反转</button><button class="ghost" id="invY">上下反转</button></div>
<div id="tip"></div>
<button id="punch" class="off">打孔</button>

<div class="panel" id="startP">
  <div class="card">
    <h2>放大镜 · 单孔 demo</h2>
    <p>1. <b>右手</b>拖动屏幕上不停变大变小的视线圈，套住虚线目标。</p>
    <p>2. <b>左手</b>按住左半边屏幕任意位置：圈在那一刻定格并放大。圈越小，放得越大，分数倍率越高。</p>
    <p>3. <b>倾斜手机</b>在放大镜里移动针头，<b>右手</b>点「打孔」。</p>
    <p>左手松开，或针头跑出放大镜，就会脱锁，回到第 1 步。</p>
    <p style="color:#8fa0bf">建议横屏、双手握持。放大那一刻会以当前握姿自动校准。</p>
    <button class="btn" id="startBtn">开启陀螺仪并开始</button>
    <p id="startMsg" style="color:#ff9b8a"></p>
  </div>
</div>

<div class="panel hidden" id="resP">
  <div class="card">
    <h2 id="resTitle"></h2>
    <div class="big" id="resScore"></div>
    <p id="resDetail" style="text-align:center"></p>
    <button class="btn" id="againBtn">再来一个</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(3,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;layout()}
addEventListener('resize',resize);

// ---------- tuning (shares the main game's 「调手感」 settings via localStorage) ----------
const TUNE_DEF={dead:1.5,full:22,speed:210,curve:1,follow:8,tremor:1,invX:false,invY:false};
const TUNE=(()=>{try{return Object.assign({},TUNE_DEF,JSON.parse(localStorage.getItem('sodaTune')||'{}'))}catch(e){return Object.assign({},TUNE_DEF)}})();
function saveTune(){try{localStorage.setItem('sodaTune',JSON.stringify(TUNE))}catch(e){}}
function tiltAxis(v,inv){const a=Math.abs(v)-TUNE.dead;if(a<=0)return 0;const k=Math.min(1,a/Math.max(1,TUNE.full-TUNE.dead));return Math.sign(v)*Math.pow(k,TUNE.curve)*(inv?-1:1)}
function syncInv(){$('invX').style.color=TUNE.invX?'#ffd23f':'';$('invY').style.color=TUNE.invY?'#ffd23f':''}
$('invX').onclick=()=>{TUNE.invX=!TUNE.invX;saveTune();syncInv()};
$('invY').onclick=()=>{TUNE.invY=!TUNE.invY;saveTune();syncInv()};
syncInv();

// ---------- gyroscope ----------
let raw={x:0,y:0},base={x:0,y:0},gotTilt=false,listening=false;
function onOri(e){
  if(e.beta==null||e.gamma==null)return;
  gotTilt=true;
  const ang=(screen.orientation&&screen.orientation.angle)??window.orientation??0;
  let x,y;
  if(ang===90){x=e.beta;y=-e.gamma}
  else if(ang===-90||ang===270){x=-e.beta;y=e.gamma}
  else{x=e.gamma;y=e.beta}
  raw.x=x;raw.y=y;
}
async function enableTilt(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')return false;
    }
    if(!listening){addEventListener('deviceorientation',onOri);listening=true}
    if(!gotTilt)await new Promise(r=>setTimeout(r,900));
    return gotTilt;
  }catch(e){return false}
}

// ---------- haptics (same trick as the main game) ----------
function iosTick(){try{const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');l.style.display='none';l.appendChild(i);document.head.appendChild(l);l.click();l.remove()}catch(e){}}
let hapPending=0;
function flushHaptic(){if(!hapPending)return;const n=Math.min(hapPending,3);hapPending=0;for(let k=0;k<n;k++)iosTick()}
['touchend','click'].forEach(t=>document.addEventListener(t,flushHaptic,true));
function buzz(p){if(navigator.vibrate){try{navigator.vibrate(p)}catch(e){};return}hapPending=Math.max(hapPending,Array.isArray(p)?Math.ceil(p.length/2):1);iosTick()}

// ---------- world ----------
const BW=320,BH=200;          // biscuit size (world units), same as 长方苏打
const TARGET_R=16;            // target circle radius = hole size at 1× (width/10 diameter)
const HOLE_R0=16;             // hole radius before magnification; shrinks as 1/mag
const RW_MIN=18,RW_MAX=60;    // sight circle radius range (world units)
const PULSE=2.2;              // seconds per grow-shrink cycle
let s0=1,O={x:0,y:0},LENS_R=150,LENS_C={x:0,y:0};
function layout(){
  s0=Math.min(W*0.82/BW,H*0.62/BH);
  O={x:W/2,y:H*0.47};
  LENS_R=Math.min(W,H)*0.44;
  LENS_C={x:W/2,y:Math.max(LENS_R+8,Math.min(H-LENS_R-8,H*0.47))};
  if(S&&!S.drag){S.cx=clamp(S.cx,-BW/2-20,BW/2+20);S.cy=clamp(S.cy,-BH/2-20,BH/2+20)}
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const w2s=(x,y)=>({x:O.x+x*s0,y:O.y+y*s0});
const s2w=(x,y)=>({x:(x-O.x)/s0,y:(y-O.y)/s0});

// salt specks, fixed per load
const SALT=[...Array(70)].map(()=>({x:(Math.random()-.5)*BW*.9,y:(Math.random()-.5)*BH*.85,r:.8+Math.random()*1.4}));

let S=null;
function newRound(){
  S={
    t:0,cx:-60,cy:20,                 // sight circle centre (world)
    tx:(Math.random()-.5)*(BW-90),ty:(Math.random()-.5)*(BH-80), // target
    lock:null,                        // {rw,mag,mult,cx,cy}
    nx:0,ny:0,vx:0,vy:0,              // needle offset from lens centre (screen px)
    hole:null,done:false,flash:'',flashT:0,unlocks:0,
    drag:null,
  };
}

// ---------- input ----------
const leftPresses=new Set();
function rwNow(){return RW_MIN+(RW_MAX-RW_MIN)*(0.5+0.5*Math.sin(S.t*2*Math.PI/PULSE))}
function lock(){
  const rw=rwNow();
  const R=rw*s0;
  const mag=Math.max(1.2,LENS_R/R);
  const mult=1+2*(RW_MAX-rw)/(RW_MAX-RW_MIN);
  S.lock={rw,mag,mult,cx:S.cx,cy:S.cy};
  S.nx=S.ny=S.vx=S.vy=0;
  base={x:raw.x,y:raw.y};             // calibrate to the current grip
  S.drag=null;
  buzz(15);
}
function unlock(why){
  if(!S.lock)return;
  S.lock=null;S.unlocks++;
  if(why){S.flash=why;S.flashT=1.4;buzz([40,40,40])}
}
cv.addEventListener('pointerdown',e=>{
  if(!S||S.done)return;
  e.preventDefault();
  const c=w2s(S.cx,S.cy),R=rwNow()*s0;
  const onCircle=Math.hypot(e.clientX-c.x,e.clientY-c.y)<R+24;
  if(!S.lock&&onCircle&&!S.drag){S.drag={id:e.pointerId,mode:'direct',ox:S.cx-s2w(e.clientX,e.clientY).x,oy:S.cy-s2w(e.clientX,e.clientY).y};return}
  if(e.clientX<W/2){
    leftPresses.add(e.pointerId);
    if(!S.lock)lock();
    return;
  }
  if(!S.lock&&!S.drag)S.drag={id:e.pointerId,mode:'pad',lx:e.clientX,ly:e.clientY};
});
cv.addEventListener('pointermove',e=>{
  if(!S||!S.drag||S.drag.id!==e.pointerId||S.lock)return;
  const d=S.drag;
  if(d.mode==='direct'){const w=s2w(e.clientX,e.clientY);S.cx=w.x+d.ox;S.cy=w.y+d.oy}
  else{S.cx+=(e.clientX-d.lx)/s0;S.cy+=(e.clientY-d.ly)/s0;d.lx=e.clientX;d.ly=e.clientY}
  S.cx=clamp(S.cx,-BW/2-20,BW/2+20);S.cy=clamp(S.cy,-BH/2-20,BH/2+20);
});
function endPtr(e){
  if(!S)return;
  if(S.drag&&S.drag.id===e.pointerId)S.drag=null;
  if(leftPresses.delete(e.pointerId)&&leftPresses.size===0)unlock('左手松开，脱锁');
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
// a left-hand press that lands on the punch button area still counts via the canvas; the button itself:
$('punch').addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();
  if(!S||S.done)return;
  if(!S.lock){S.flash='先用左手按住左半屏放大';S.flashT=1.2;buzz([20,30,20]);return}
  doPunch();
});

function needleWorld(){const L=S.lock;return{x:L.cx+S.nx/(s0*L.mag),y:L.cy+S.ny/(s0*L.mag)}}
function doPunch(){
  const L=S.lock,p=needleWorld();
  const holeR=HOLE_R0/L.mag;
  const d=Math.hypot(p.x-S.tx,p.y-S.ty);
  const onBiscuit=Math.abs(p.x)<BW/2&&Math.abs(p.y)<BH/2;
  const acc=1-d/TARGET_R;
  let score=0,title,detail;
  if(!onBiscuit){title='扎到传送带了';}
  else if(acc<=0){title='扎歪了';}
  else{
    const pct=d/TARGET_R;
    title=pct<=.15?'完美正中！':pct<=.4?'很准':pct<=.7?'还行':'擦边';
    score=Math.round((10+90*acc*acc)*L.mult);
  }
  detail=`偏差 ${(d).toFixed(1)}（目标半径 ${TARGET_R}）<br>放大 ${L.mag.toFixed(1)}× · 倍率 ×${L.mult.toFixed(2)} · 孔半径 ${holeR.toFixed(1)}<br>中途脱锁 ${S.unlocks} 次`;
  S.hole={x:p.x,y:p.y,r:holeR};S.done=true;
  buzz(score>0&&acc>.85?[60,30,60,30,60]:[60]);
  setTimeout(()=>{
    S.lock=null;leftPresses.clear();
    $('resTitle').textContent=title;$('resScore').textContent=score+' 分';$('resDetail').innerHTML=detail;
    $('resP').classList.remove('hidden');
  },650);
}
$('againBtn').onclick=()=>{$('resP').classList.add('hidden');newRound()};
$('startBtn').onclick=async()=>{
  $('startMsg').textContent='正在开启陀螺仪…';
  const ok=await enableTilt();
  if(!ok){$('startMsg').textContent='没检测到陀螺仪。请用手机 Safari 或 Chrome 打开（微信里点右上角「在浏览器打开」），iPhone 弹窗时点「允许」。';return}
  $('startP').classList.add('hidden');newRound();
};

// ---------- update ----------
let noiseT=0;
function update(dt){
  if(!S)return;
  S.t+=dt;noiseT+=dt;
  if(S.flashT>0)S.flashT-=dt;
  if(S.lock&&!S.done){
    const tx=raw.x-base.x,ty=raw.y-base.y;
    const sp=TUNE.speed*s0*0.9;      // screen px/s at full tilt, same feel as the main game
    const gx=tiltAxis(tx,TUNE.invX)*sp,gy=tiltAxis(ty,TUNE.invY)*sp;
    const f=1-Math.exp(-TUNE.follow*dt);
    S.vx+=(gx-S.vx)*f;S.vy+=(gy-S.vy)*f;
    // hand tremor: smooth wander, in screen px
    const tr=5*TUNE.tremor;
    const jx=(Math.sin(noiseT*3.1)+Math.sin(noiseT*5.7+1.3)*.6)*tr,jy=(Math.sin(noiseT*2.7+2)+Math.sin(noiseT*6.3)*.6)*tr;
    S.nx+=(S.vx+jx*1.6)*dt;S.ny+=(S.vy+jy*1.6)*dt;
    if(Math.hypot(S.nx,S.ny)>LENS_R)unlock('针头跑出放大镜，脱锁');
  }
  // UI text
  const rw=S.lock?S.lock.rw:rwNow();
  const mult=1+2*(RW_MAX-rw)/(RW_MAX-RW_MIN);
  const mag=Math.max(1.2,LENS_R/(rw*s0));
  $('hud').innerHTML=S.lock
    ?`<b>已放大 ${S.lock.mag.toFixed(1)}×</b> · 倍率 ×${S.lock.mult.toFixed(2)}`
    :`视线圈 ${rw.toFixed(0)} · 现在按下 = 放大 <b>${mag.toFixed(1)}×</b> · 倍率 ×${mult.toFixed(2)}`;
  $('tip').textContent=S.done?'':S.lock?'倾斜手机移动针头，右手点「打孔」；左手别松':'右手拖圈套住虚线目标，然后左手按住左半屏';
  $('punch').classList.toggle('off',!S.lock);
}

// ---------- draw ----------
function drawScene(k,ox,oy){
  ctx.setTransform(DPR*k,0,0,DPR*k,DPR*ox,DPR*oy);
  // biscuit
  const g=ctx.createLinearGradient(0,-BH/2,0,BH/2);g.addColorStop(0,'#f6cf7d');g.addColorStop(1,'#d9a24a');
  ctx.fillStyle=g;rr(-BW/2,-BH/2,BW,BH,14);ctx.fill();
  ctx.strokeStyle='#b07a2c';ctx.lineWidth=3;ctx.stroke();
  ctx.strokeStyle='#c8913d66';ctx.lineWidth=2;rr(-BW/2+12,-BH/2+12,BW-24,BH-24,8);ctx.stroke();
  ctx.fillStyle='#fff7e4cc';for(const s of SALT){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}
  // target
  ctx.save();ctx.setLineDash([4,3]);ctx.strokeStyle='#5a3a10';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.arc(S.tx,S.ty,TARGET_R,0,7);ctx.stroke();ctx.restore();
  ctx.fillStyle='#5a3a1088';ctx.beginPath();ctx.arc(S.tx,S.ty,1.4,0,7);ctx.fill();
  // hole
  if(S.hole){ctx.fillStyle='#2a1a08';ctx.beginPath();ctx.arc(S.hole.x,S.hole.y,S.hole.r,0,7);ctx.fill();
    ctx.strokeStyle='#8a5a1f';ctx.lineWidth=Math.max(.3,S.hole.r*.18);ctx.stroke()}
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawBelt(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0d1626';ctx.fillRect(0,0,W,H);
  const top=O.y-BH/2*s0-26,bot=O.y+BH/2*s0+26;
  ctx.fillStyle='#232a36';ctx.fillRect(0,top,W,bot-top);
  ctx.strokeStyle='#2f3846';ctx.lineWidth=2;
  for(let x=-40+((S?S.t*0:0)%40);x<W+40;x+=40){ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bot);ctx.stroke()}
  ctx.fillStyle='#8592a6';ctx.fillRect(0,top-6,W,6);ctx.fillRect(0,bot,W,6);
  // left-half hint
  if(S&&!S.lock&&!S.done){ctx.fillStyle='#ffd23f0d';ctx.fillRect(0,0,W/2,H);
    ctx.fillStyle='#ffd23f55';ctx.font='600 13px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText('左手按住这半边 = 放大',W/4,H-60)}
}
function drawLensFrame(cx,cy,R,locked){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // handle, pointing to lower-left (held by the left hand)
  const a=Math.PI*0.78,hx=cx+Math.cos(a)*R,hy=cy+Math.sin(a)*R;
  const len=Math.max(26,R*0.55);
  ctx.lineCap='round';
  ctx.strokeStyle='#4a2f12';ctx.lineWidth=Math.max(8,R*0.12);
  ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx+Math.cos(a)*len,hy+Math.sin(a)*len);ctx.stroke();
  ctx.strokeStyle=locked?'#ffd23f':'#e8edf7';ctx.lineWidth=locked?6:3.5;
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
  if(!locked){ctx.strokeStyle='#ffffff40';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R-5,0,7);ctx.stroke()}
}
function drawNeedle(x,y){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const r=HOLE_R0*s0;
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
  ctx.strokeStyle='#ffd23faa';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(x-r-6,y);ctx.lineTo(x-r+4,y);ctx.moveTo(x+r-4,y);ctx.lineTo(x+r+6,y);
  ctx.moveTo(x,y-r-6);ctx.lineTo(x,y-r+4);ctx.moveTo(x,y+r-4);ctx.lineTo(x,y+r+6);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fill();
}
function draw(){
  drawBelt();
  if(!S)return;
  drawScene(s0,O.x,O.y);
  if(S.lock){
    const L=S.lock,src=w2s(L.cx,L.cy);
    // dim everything, mark the circled spot
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle='#0d1626a0';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#ffd23f88';ctx.setLineDash([5,4]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(src.x,src.y,L.rw*s0,0,7);ctx.stroke();ctx.setLineDash([]);
    // magnified view inside the lens: shows exactly the circled area
    const k=s0*L.mag;
    ctx.save();ctx.beginPath();ctx.arc(LENS_C.x,LENS_C.y,LENS_R,0,7);
    ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clip();
    ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#232a36';ctx.fillRect(0,0,W,H);
    drawScene(k,LENS_C.x-L.cx*k,LENS_C.y-L.cy*k);
    ctx.restore();
    // lens glare
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const gl=ctx.createRadialGradient(LENS_C.x-LENS_R*.4,LENS_C.y-LENS_R*.45,4,LENS_C.x-LENS_R*.4,LENS_C.y-LENS_R*.45,LENS_R*.6);
    gl.addColorStop(0,'#ffffff30');gl.addColorStop(1,'#ffffff00');ctx.fillStyle=gl;
    ctx.beginPath();ctx.arc(LENS_C.x,LENS_C.y,LENS_R,0,7);ctx.fill();
    drawLensFrame(LENS_C.x,LENS_C.y,LENS_R,true);
    if(!S.done)drawNeedle(LENS_C.x+S.nx,LENS_C.y+S.ny);
  }else if(!S.done){
    const c=w2s(S.cx,S.cy);drawLensFrame(c.x,c.y,rwNow()*s0,false);
  }
  if(S.flashT>0){
    ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=Math.min(1,S.flashT);
    ctx.fillStyle='#ff6b5a';ctx.font='800 22px -apple-system,sans-serif';ctx.textAlign='center';
    ctx.fillText(S.flash,W/2,Math.max(70,H*0.14));ctx.globalAlpha=1;
  }
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
resize();requestAnimationFrame(loop);
</script>
</body>
</html>
